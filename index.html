9"],"e":1,"why":"插孔是纯接口，风险全在数据与同意，现行规范基本覆盖。"},"law":{"j":["J4","J3"],"v":1,"basis":"《医疗器械监督管理条例》；《个人信息保护法》第28条","why":"接口是纯器械与数据问题，现行法完全覆盖；关键在注册类别与术后数据流向。"},"cases":[],"kits":[]},{"id":"M02","g":"M","fn":"培养舱 + 全感官替代","work":"Matrix 电影 1、二次复兴 II","desc":"人体泡在舱里，Matrix 顶替全部感官输入并接管运动输出，模拟 1999 年地球，终身不间断","flow":"B↔M","lv":3,"lvs":"L3","basis":"需写入全部感觉通路、抑制本体感觉、闭环延迟 <10ms、数十年零故障；感觉剥夺下意识稳定性未知","note":"不是戴 VR，是把脑的输入输出整条换掉；比 C04 超梦更极端","see":["C04","C05","C19","M01","M17","M18","M21","X05"],"groups":["immersion"],"eth":{"n":["N3","N5","N1"],"e":4,"why":"一方从未同意、也从无机会同意——这是结构性绑架，不是契约问题。"},"law":{"j":["J1","J7","J2"],"v":2,"basis":"《刑法》第238条（非法拘禁）、第234条；《民法典》第1003条（身体权）","why":"剥夺人身自由并占有身体，构成非法拘禁与故意伤害。「从未同意」不影响违法性，只影响监护责任与量刑。"},"cases":[],"kits":[]},{"id":"M03","g":"M","fn":"残余自我影像 RSI","work":"Matrix 电影 1","desc":"人在 Matrix 里的形象由自我形象字段决定，与真实肉体不同","flow":"M→B","lv":2,"lvs":"L2","basis":"现实有身体意象、橡胶手错觉等可塑性证据；系统级可配置自我形象字段是设定","note":"解释了为何拔除后 Neo 秃头苍白、Matrix 里却有头发","see":["C01","C02","C03","C12","M05","X01","X23","X24"],"groups":["read"],"eth":{"n":["N4"],"e":3,"why":"自我认知可被运营商改参数，等于人格的「出厂设置」由他人决定。"},"law":{"j":["J2","J5"],"v":1,"basis":"《民法典》第1019条（禁止伪造肖像）、第1024条（名誉权）、第1034条（个人信息）","why":"自主设定的数字形象受肖像权保护；技术本身合规，但平台单方改参数即构成侵权，用户可要求停止侵害与赔偿。"},"cases":[],"kits":[]},{"id":"M04","g":"M","fn":"Construct 构造体 + 技能下载","work":"Matrix 电影 1、Animatrix · Program / Osiris","desc":"空白白色训练空间，数小时内灌入整套武术 / 跳跃程序（I know Kung Fu）","flow":"M→B","lv":3,"lvs":"L3","basis":"现实运动技能靠反复练习形成程序性记忆；tDCS/TMS 只能小幅加速，无写入复杂动作程序的理论","note":"全系列流传最广的想象，也是编解码缺口最明显的一条","see":["C16","M07","M13","X18","X20","X21","X22"],"groups":["write"],"eth":{"n":["N2","N6"],"e":2,"why":"技能下载摧毁「努力—回报」的教育基础，属增强公平性老问题，只是规模更极端。"},"law":{"j":["J4","J5","J8"],"v":3,"basis":"《医疗器械监督管理条例》；《执业医师法》《道路交通安全法》（资质要求）；《著作权法》","why":"不作判断：技能作为数据可受著作权保护，但「植入人体形成能力」无审批类别。更硬的一条是资质法规——持证要求不因技能真实而豁免，下载完也不能行医或驾驶。"},"cases":[],"kits":["K15","K18"]},{"id":"M05","g":"M","fn":"操作员读代码瀑布","work":"Matrix 电影 1–3","desc":"Link / Tank / Mouse 看着绿色字符流实时理解 Matrix 里正在发生什么","flow":"B←M","lv":2,"lvs":"L2","basis":"现实有感觉替代（视觉→触觉/听觉），但把整个模拟实时压缩成人可读流属信息可视化设定","note":"本质是给观众看的界面，不是给人脑的输入格式","see":["C01","C02","C03","C12","M03","X01","X23","X24"],"groups":["read"],"eth":{"n":["N1"],"e":2,"why":"亲密关系内的全景监视，同意很容易变成「为了任务」的默认勾选。"},"law":{"j":["J3","J1"],"v":1,"basis":"《个人信息保护法》第13条（履行合同所必需）、第51条（权限最小化）；《刑法》第253条之一、第285条","why":"职务范围内的授权访问合法，越权读取即构成侵犯公民个人信息罪或非法获取计算机信息系统数据罪。分界线是权限与日志，不是技术能力。"},"cases":["R04","R07","R19","R22"],"kits":["K03","K09","K12"]},{"id":"M06","g":"M","fn":"电话线作为进出通道","work":"Matrix 电影 1–3","desc":"必须找到响铃的固定电话才能 jack-out；通道被切断即被困","flow":"SEC","lv":1,"lvs":"L1","basis":"本质是会话握手 / 安全断连协议，工程上平凡","note":"设定上为制造紧张感，不是技术必然","see":["C06","C07","C08","C20","M08","M09","X02","X07"],"groups":["security"],"eth":{"n":["N9","N7"],"e":1,"why":"单点故障与通道安全，属常规网络可靠性问题。"},"law":{"j":["J6","J5"],"v":1,"basis":"《网络安全法》第21条（等级保护）；《电信条例》","why":"单点通道属网络可靠性与接入管理问题，现行法有明确要求；运营者未尽保障义务致损，按违约与侵权处理。"},"cases":["R27"],"kits":["K17"]},{"id":"M07","g":"M","fn":"红药丸 / 蓝药丸","work":"Matrix 电影 1、Resurrections","desc":"中断追踪程序、把人从舱中唤醒并定位；蓝药丸则重置记忆、回归原有生活","flow":"M→B","lv":4,"lvs":"L1（断开）/ L4（记忆重置）","basis":"断开 ≈ 麻醉唤醒 + 摘除设备；抹掉一段人生并植入 20 年虚假叙事是 L4","note":"常被当成吃药，其实是两个操作：断链（易）与记忆编辑（极难）","see":["C16","M04","M13","X18","X20","X21","X22"],"groups":["write"],"eth":{"n":["N5","N2"],"e":4,"why":"难题不在药丸，在「知道真相的人是否有权替别人决定」——家长主义与自主的经典死结。"},"law":{"j":["J2","J7"],"v":3,"basis":"《宪法》第35、36条（言论与信仰自由）；《民法典》第990条（一般人格权）","why":"不作判断：现行法只约束「外部干预」，不处理「强制改变他人对现实的认知」。无对应罪名，也无成熟侵权类型，造成精神损害只能走一般人格权。"},"cases":[],"kits":[]},{"id":"M08","g":"M","fn":"模拟内死亡 → 肉体死亡","work":"Matrix 电影 1–3","desc":"身体不能没有意识而存活；Matrix 里被杀，现实肉体同步死亡","flow":"SEC","lv":1,"lvs":"L1","basis":"工程上可以做成恶意耦合（检测致命事件触发致命生理动作），但属设计选择，不是物理定律","note":"现实 VR 不会这样；作品用它把虚拟风险实体化","see":["C06","C07","C08","C20","M06","M09","X02","X07"],"groups":["security"],"eth":{"n":["N7","N5"],"e":3,"why":"脑死亡判定已有法，但「虚拟里死导致现实死」的因果链，责任在内容方、平台还是用户？无归属规则。"},"law":{"j":["J7","J1","J5"],"v":3,"basis":"《刑法》第233条（过失致人死亡）；《民法典》第1198条（安全保障义务）、第1202条（产品责任）","why":"不作判断：「虚拟事件导致生理死亡」的因果关系在医学与法学上都没有标准；注意义务在内容方、平台、设备商之间如何分配，现行法没有规则。"},"cases":[],"kits":[]},{"id":"M09","g":"M","fn":"Agent 附身 / Smith 占据","work":"Matrix 电影 1–3（Bane）","desc":"程序临时接管仍在舱中的人的身体；Smith 甚至借手机通道从 Matrix 跨到现实世界","flow":"M→B","lv":4,"lvs":"L4–L5","basis":"需完整双向写入 + 即时人格覆盖 + 运动接管；数字程序跨到生物脑无任何已知机制","note":"全系列最超自然的一条，本质是惊悚片设定","see":["C06","C07","C08","C20","M06","M08","X02","X07"],"groups":["security"],"eth":{"n":["N3","N4","N7"],"e":4,"why":"被附身者事后毫无记忆，既不能自证清白也不能作证——法律主体资格在此断裂。"},"law":{"j":["J7","J1"],"v":3,"basis":"《刑法》第18条（责任能力）、第28条（胁从犯）；间接正犯理论","why":"不作判断：施害方若为人，可按间接正犯追究、被控者无罪；但施害方是非人程序时没有刑事责任主体。漏洞不在定性，在「没有被告」。"},"cases":[],"kits":[]},{"id":"M10","g":"M","fn":"子弹时间 / 弯曲勺子","work":"Matrix 电影 1、Reloaded、游戏","desc":"没有勺子——感知到代码层后改写局部规则；主观减速、跑墙、跳楼","flow":"—","lv":5,"lvs":"L5","basis":"主观时间无限加速违反神经传导与实时计算上限；改写模拟物理规则属世界观特权","note":"哲学上说的是看穿表象，技术上不对应任何东西","see":["C03","M15","M16","M20"],"groups":["rules"],"eth":{"n":["N6"],"e":1,"why":"纯个体能力提升，无人直接受损；争议只在竞技公平，反兴奋剂规则可类推。"},"law":{"j":["J1"],"v":4,"basis":"—（无对应行为类型）","why":"不判断：主观时间感知加速不改变客观物理过程，「躲子弹」在物理上不可能，法律不评价不可能之事。若仅指感知加速本身，按 C03 处理。"},"cases":[],"kits":[]},{"id":"M11","g":"M","fn":"流亡程序 / 数字人格","work":"Matrix Reloaded、Revolutions","desc":"先知、架构师、梅罗文加、制钥师、列车人、撒拉弗、萨蒂都是有性格与意志的程序","flow":"S","lv":4,"lvs":"L3–L4","basis":"现实 LLM 已能做行为层拟真；程序是否有主观体验是 L4 哲学问题","note":"与 C10 形成对照：CP2077 说印迹没意识，Matrix 说程序有意志——两个世界观正好相反","see":["C09","C10","C11","C13","C14","C15","C20","M12"],"groups":["upload"],"eth":{"n":["N4","N8"],"e":4,"why":"流亡程序有没有「不被删除权」，完全取决于它算不算主体——同一个前置问题。"},"law":{"j":["J2","J8"],"v":3,"basis":"《民法典》第2、13条（主体范围）；《刑法》第275条（故意毁坏财物）；《著作权法》","why":"不作判断：程序不具民事主体资格，故「不被删除权」的现行法答案是「没有」；删除按数据或财产处理，可能构成毁坏财物，但不构成杀人。"},"cases":[],"kits":[]},{"id":"M12","g":"M","fn":"Neo / Trinity 被重构","work":"Matrix Resurrections","desc":"死后约 60 年，机器用囊中身体 + 代码把二人重建并放回新 Matrix；Analyst 靠二人的情感模态给系统供能","flow":"S + B↔M","lv":5,"lvs":"L4–L5","basis":"需从残留数据重建完整人格并保证同一性；情感供能是设定","note":"第四部把电池设定改成情感电池，科学上更弱、隐喻上更直白","see":["C09","C10","C11","C13","C14","C15","C20","M11"],"groups":["upload"],"eth":{"n":["N4"],"e":4,"why":"被重构的是复活还是复制？这个问题电影自己不回答，法律也无法回答。"},"law":{"j":["J2"],"v":4,"basis":"—（无对应行为类型）","why":"不判断：「重构」在物理上没有对应过程，法律无从假设。即使是复制，现行法只处理原件的死亡，复制件不产生新的权利主体。"},"cases":[],"kits":[]},{"id":"M13","g":"M","fn":"模态与信念压制","work":"Matrix Resurrections","desc":"Analyst 用心理治疗叙事、药物与模态把 Neo 困在「我是游戏设计师 Thomas Anderson」的假身份里","flow":"M→B","lv":4,"lvs":"L4","basis":"现实记忆再巩固干预可削弱特定恐惧记忆；植入整套替代人生并长期维持远超","note":"与 M07 蓝药丸同源，是第四部对第一部的复写","see":["C16","M04","M07","X18","X20","X21","X22"],"groups":["write"],"eth":{"n":["N2","N5"],"e":4,"why":"直接改写「你相信什么」，是认知自由的极限侵犯；没有任何法律语言能描述「信念被删除」。"},"law":{"j":["J2","J3","J7"],"v":3,"basis":"《宪法》第35、36条；《民法典》第990条；无对应罪名","why":"不作判断：信念被强制改写，现行法找不到可评价的行为类型——思想自由只约束外部干预，而「写入」发生在内部。既无罪名，也无侵权案由。"},"cases":[],"kits":[]},{"id":"M14","g":"M","fn":"人体作生物电池 + 遮天","work":"Matrix 二次复兴 II、电影 1","desc":"人类遮蔽天空断绝太阳能后，机器把人圈养为能源并用 Matrix 囚禁意识","flow":"—","lv":5,"lvs":"L5","basis":"人体作为电源在热力学上效率极低（作品也含糊带过与某种融合）；属反乌托邦寓言","note":"科学上最站不住，却是整个世界观的经济学地基","see":["C05","C11","C17","C18","X10","X11","X14"],"groups":["society"],"eth":{"n":["N8","N5"],"e":3,"why":"奴隶制的技术版——反人类罪框架能覆盖性质，覆盖不了「从未出生、从未有机会同意」的部分。"},"law":{"j":["J7","J2"],"v":2,"basis":"《刑法》第244条（强迫劳动）；美国 18 U.S.C. §1581（奴役）；ICCPR 第8条","why":"奴役与强迫劳动在主要法域都是重罪。L5 是技术难度，不是法律难度——技术上做不到，不影响法律上的定性。"},"cases":[],"kits":[]},{"id":"M15","g":"M","fn":"世界纪录：看穿代码","work":"Matrix Animatrix · World Record","desc":"短跑者把身体推到极限时短暂看穿 Matrix 代码、几乎自我脱离","flow":"—","lv":5,"lvs":"L5","basis":"无对应机制","note":"与 Kid's Story 同属靠意志力越狱的例外设定","see":["C03","M10","M16","M20"],"groups":["rules"],"eth":{"n":["N6"],"e":1,"why":"能力垄断问题，属平台与竞技治理范畴。"},"law":{"j":["J2"],"v":4,"basis":"—（无对应行为类型）","why":"不判断：纯感知设定，没有外部行为，也没有法益侵害对象；法律不评价「看到什么」。"},"cases":[],"kits":[]},{"id":"M16","g":"M","fn":"自我拔除","work":"Matrix Animatrix · Kid's Story","desc":"少年未服红药丸、未外部协助，靠自我意识从 Matrix 中脱离","flow":"—","lv":5,"lvs":"L5","basis":"无对应机制","note":"设定中的异常个例，不可推广为技术路径","see":["C03","M10","M15","M20"],"groups":["rules"],"eth":{"n":["N5"],"e":1,"why":"这条恰恰是伦理上最正面的：退出权应当被无条件保障。"},"law":{"j":["J1","J5"],"v":0,"basis":"《民法典》第1219条（患者选择权）；《消费者权益保护法》第9条（自主选择）","why":"自主退出在医疗与消费两端都受支持；若运营方阻碍退出，反而构成非法拘禁。全表唯一一条法律明确站在用户一侧的。"},"cases":[],"kits":[]},{"id":"M17","g":"M","fn":"模拟 glitch / 鬼屋","work":"Matrix Animatrix · Beyond","desc":"局部代码错误导致物理规则失效、时间异常的区域","flow":"M→B","lv":2,"lvs":"L2","basis":"可类比游戏引擎物理 bug / 局部模拟一致性失效；工程上可想象","note":"罕见的低难度条目：它只是软件缺陷，不是超能力","see":["C04","C05","C19","M01","M02","M18","M21","X05"],"groups":["immersion"],"eth":{"n":["N1"],"e":3,"why":"惩罚「看见真相」的人是审查伦理问题，且发生在无法申诉的封闭系统内。"},"law":{"j":["J7","J1"],"v":2,"basis":"《刑法》第234、238条","why":"对「看见系统异常」的人施加惩罚，构成故意伤害或非法拘禁，无任何免责事由——「他知道了不该知道的」不是抗辩。"},"cases":[],"kits":[]},{"id":"M18","g":"M","fn":"训练构造体与选择权","work":"Matrix Animatrix · Program / Osiris","desc":"武士训练模拟里 Cis 拒绝回收、选择回 Matrix；Osiris 号在模拟里演练","flow":"B↔M","lv":2,"lvs":"L2","basis":"构造体本质是 VR 训练舱，现实已有高保真模拟训练","note":"把模拟是否比现实更好这个主题压缩进 7 分钟","see":["C04","C05","C19","M01","M02","M17","M21","X05"],"groups":["immersion"],"eth":{"n":["N5","N3"],"e":2,"why":"训练场景里的「选择权」是真选择还是设计好的假选择，是同意伦理的核心争点。"},"law":{"j":["J5","J2"],"v":1,"basis":"《消费者权益保护法》第8、20条；《民法典》第148条（欺诈）","why":"训练程序本身合法；但若「选择权」是设计好的假选择，构成欺诈与知情权侵害，可依第148条撤销并索赔。"},"cases":[],"kits":[]},{"id":"M19","g":"M","fn":"反向接入：感化机器","work":"Matrix Animatrix · Matriculated","desc":"人类捕获哨兵，把它接入人类自建的模拟，用共享体验让它自己选择倒戈","flow":"B↔B","lv":3,"lvs":"L3","basis":"需机器端也有可写接口 + 双向共情通道","note":"全系列唯一机器被人接入的方向反转，很值得单列","see":["X01","X03","X17"],"groups":["network"],"eth":{"n":["N5","N8"],"e":3,"why":"单方面改造另一智能体的价值取向，会随 AI 人格地位上升而放大。"},"law":{"j":["J8","J2"],"v":3,"basis":"《民法典》第2、13条；《刑法》第275条；无「机器权利」规范","why":"不作判断：现行法只保护人的意志自由，AI 无意志自由可侵；若该智能体有财产价值，单方改造可能构成毁坏财物——但「改造它的价值观」本身不是可诉行为。"},"cases":[],"kits":[]},{"id":"M20","g":"M","fn":"玩法化的规则超越","work":"Matrix 游戏 · Enter the Matrix / Path of Neo","desc":"focus 减速、跑墙、空中连击、后期觉醒后可改写规则","flow":"—","lv":5,"lvs":"L5","basis":"游戏机制，不对应技术","note":" :"host 心智核心 / 保真度测试","work":"《西部世界》","desc":"心智可复制、可移植到不同躯壳；人类意识副本需通过 fidelity 测试；升华","flow":"S","lv":4,"lvs":"L4","basis":"保真度验证无客观标准","note":"fidelity 测试是罕见的、把验证问题写进设定的做法","see":["C05","C09","C10","C11","C13","C14","C15","C17"],"groups":["upload","society"],"eth":{"n":["N4","N8"],"e":4,"why":"被反复杀死做测试：若它算人，这是酷刑；若不算，这是人类自我认知的地基被抽走。"},"law":{"j":["J2","J7"],"v":3,"basis":"《刑法》第232条；《民法典》第13条","why":"不作判断：若 host 是人，反复杀死构成故意杀人；若不是，只是设备测试。全部判定系于「是不是人」，而这一步现行法没有标准——法律把难题原样退回。"},"cases":[],"kits":[]},{"id":"X15","g":"X","fn":"摇光 / STL 灵魂翻译","work":"《刀剑神域》Alicization","desc":"读取并复制光量子脑中的灵魂（Fluctuating Light），AI 与真人意识等价","flow":"S","lv":5,"lvs":"L4–L5","basis":"假设意识是可被读写的物理场，无证据","note":"少数把灵魂直接物质化的设定","see":["C09","C10","C11","C13","C14","C15","C20","M11"],"groups":["upload"],"eth":{"n":["N4","N8"],"e":4,"why":"灵魂被翻译成可编辑数据后，编辑权归谁？这是 X01 的另一条路径。"},"law":{"j":["J2","J3"],"v":3,"basis":"《民法典》第13条；《个人信息保护法》第28条","why":"不作判断：与 X01 同构——灵魂被翻译成数据后，编辑权只能按个人信息处理规则行使；「编辑后的人还是不是原来的人」无规定。"},"cases":[],"kits":[]},{"id":"X16","g":"X","fn":"FullDive 全潜行","work":"《刀剑神域》SAO / GGO","desc":"非侵入头盔读脑 + 阻断本体感觉 + 全感官写入；NERvGear 可微波致死","flow":"B↔M","lv":3,"lvs":"L3","basis":"最大虚构点：非侵入设备达到侵入式全带宽；EEG 信噪比远不够","note":"与 M02 对比极有价值：一个开孔、一个戴头盔，却要求同样带宽","see":["C04","C05","C19","M01","M02","M17","M18","M21"],"groups":["immersion"],"eth":{"n":["N3","N5","N1"],"e":3,"why":"SAO 事件的核心不是技术，是「3000 人被扣为人质」——运营方握有生杀权，平台权力的极端化。"},"law":{"j":["J1","J7","J5"],"v":1,"basis":"《产品质量法》；《消费者权益保护法》第18条；《刑法》第238条","why":"全潜行设备作为消费电子须通过安全认证，技术本身合规；但运营方限制登出即构成非法拘禁，致死按故意杀人或过失致人死亡。"},"cases":[],"kits":[]},{"id":"X17","g":"X","fn":"西比拉系统","work":"《心理测量者》","desc":"把大量免罪体质者的活体大脑接成一台群体裁决计算机","flow":"B↔B","lv":5,"lvs":"L4–L5","basis":"生物脑并联成计算系统无方案；伦理是核心","note":"群体脑机最极端的想象","see":["M19","X01","X03"],"groups":["network"],"eth":{"n":["N7","N6","N8"],"e":4,"why":"把定罪权交给不可解释的系统，而该系统由人脑拼成——审判主体与责任主体合一，法治基础被抽掉。"},"law":{"j":["J7","J2","J6"],"v":2,"basis":"《刑事诉讼法》第12条（未经人民法院依法判决，对任何人不得确定有罪）；《宪法》第131条","why":"定罪量刑权专属人民法院，任何算法系统不得直接认定有罪；作为侦查辅助工具时其输出只是线索，必须经法庭质证——直接采信即违法。"},"cases":[],"kits":[]},{"id":"X18","g":"X","fn":"Neuromod 神经模块","work":"《Prey》(2017)","desc":"注射式改写神经，瞬间获得技能 / 记忆；移除会失忆；Typhon 神经织网","flow":"M→B","lv":3,"lvs":"L3","basis":"与 M04 同源，但做成可安装 / 可卸载的模块","note":"把技能下载做成技能树，是游戏化最直白的一例","see":["C16","M04","M07","M13","X20","X21","X22"],"groups":["write"],"eth":{"n":["N2"],"e":2,"why":"可购买的人格与技能，把「你是谁」变成消费选择，属增强商品化的典型。"},"law":{"j":["J4","J5","J8"],"v":3,"basis":"《医疗器械监督管理条例》第二条；《专利法》第25条","why":"不作判断：植入式神经模块属第三类器械须注册，但「人格模块」不属治疗用途，拿不到适应证。技术上可做，监管上无门。"},"cases":["R09","R16","R17","R23"],"kits":["K14","K15","K18"]},{"id":"X19","g":"X","fn":"神经植入式恐怖游戏","work":"《黑镜》Playtest","desc":"AR 神经植入实时读取恐惧并生成幻觉，痛觉真实、无法退出、分不清现实","flow":"M→B","lv":3,"lvs":"L2–L3","basis":"情绪解码 + 感觉写入 + 无法区分现实","note":"与 C04/C05（超梦成瘾）几乎同一主题","see":["C04","C05","C19","M01","M02","M17","M18","M21"],"groups":["immersion"],"eth":{"n":["N5","N7"],"e":2,"why":"Playtest 的教训是知情同意被「娱乐」稀释——玩家根本不知道自己签了什么。"},"law":{"j":["J5","J1","J3"],"v":1,"basis":"《民法典》第1198条（安全保障义务）；《消费者权益保护法》第18条","why":"属消费类神经刺激设备，须符合产品安全与警示义务；「用户点了同意」不免除经营者的安全保障义务，娱乐不是豁免理由。"},"cases":[],"kits":["K01"]},{"id":"X20","g":"X","fn":"共享梦境 / 植入意念","work":"《盗梦空间》","desc":"多人进入同一梦境，向潜意识植入一个想法","flow":"M→B / B↔B","lv":4,"lvs":"L3–L4","basis":"需共享体验空间 + 精确信念写入","note":"inception 的难点不是共享，是让对方以为想法是自己的","see":["C16","M04","M07","M13","X18","X21","X22"],"groups":["write"],"eth":{"n":["N2","N1"],"e":4,"why":"全表最深的侵犯：被植入的念头会被当成自己的，受害者永远不知道自己受害，也无从申诉。"},"law":{"j":["J2","J3","J7"],"v":3,"basis":"《民法典》第147条（重大误解）、第148条（欺诈）；无对应罪名","why":"不作判断：没有「侵犯思想」的罪名或侵权类型。若植入导致财产处分，可依意思表示不真实撤销，但受害者既不知情也无法举证——救济写在纸上，实际不可用。"},"cases":["R12"],"kits":[]},{"id":"X21","g":"X","fn":"进入死者记忆残响","work":"《源代码》","desc":"反复进入某人最后 8 分钟记忆构成的模拟","flow":"M→B","lv":4,"lvs":"L4","basis":"从残留神经数据重建可交互场景","note":"与 M12（重构 Neo）同类：从残留数据造人","see":["C16","M04","M07","M13","X18","X20","X22"],"groups":["write"],"eth":{"n":["N5","N1","N8"],"e":3,"why":"死者不能同意，记忆却可被读取与展示——「数字遗骸」权利的空白地带。"},"law":{"j":["J2","J3"],"v":3,"basis":"《民法典》第994条；《人体器官移植条例》；《殡葬管理条例》","why":"不作判断：死者不享人格权，近亲属可主张死者人格利益；但「记忆」是否属于遗体的一部分没有规定——若算遗体，处理规则完全不同。"},"cases":[],"kits":["K07"]},{"id":"X22","g":"X","fn":"潜意识「井」","work":"《ID: INVADED》","desc":"从认知粒子构建死者潜意识的模拟场景，侦探潜入勘查","flow":"M→B","lv":3,"lvs":"L3","basis":"读脑 → 场景化，需高维解码","note":"把读心换成读场景，绕开了一部分编解码难题","see":["C16","M04","M07","M13","X18","X20","X21"],"groups":["write"],"eth":{"n":["N1"],"e":3,"why":"潜意识被可视化后用于审判，等于要求人为自己无法控制的部分负责。"},"law":{"j":["J3","J7"],"v":1,"basis":"《刑事诉讼法》第150条（技术侦查须批准）、第56条（非法证据排除）；《个人信息保护法》第13条","why":"只能作为法定技术侦查措施使用并接受司法审查；未经批准取得即属非法证据应予排除。直接采信等于让人为自己无法控制的心理内容负责。"},"cases":[],"kits":["K07","K20"]},{"id":"X23","g":"X","fn":"神经链接驱动替身","work":"《阿凡达》","desc":"远程遥操作基因混种躯体，双向感官映射，可换身；与星球神经网络连","flow":"B↔M","lv":3,"lvs":"L3","basis":"全双工感官映射 + 长延时下的闭环稳定","note":"与 M02 同属完整替身，但保留了真实身体","see":["C01","C02","C03","C04","C05","C12","C19","M01"],"groups":["immersion","read"],"eth":{"n":["N5","N3","N7"],"e":2,"why":"替身本身没有原主，边界较清晰；真正问题是远程操作行为的责任归属。"},"law":{"j":["J7","J5","J1"],"v":1,"basis":"《民法典》第1165条（过错责任）、第1202条（产品责任）","why":"远程操作致害，操作者是行为人，制造商按产品责任承担，网络服务商按过错承担——现行法完全能处理，只需固定「操作者—设备—网络」三层证据。"},"cases":["R06","R18"],"kits":["K13"]},{"id":"X24","g":"X","fn":"CASIE / 神经说服增强","work":"《Deus Ex: Human Revolution》","desc":"读取对方神经 / 生理状态并释放信息素，实时辅助说服","flow":"B→M","lv":2,"lvs":"L2","basis":"生理 / 情绪状态解码现实已有雏形；实时话术最优解是游戏化","note":"少数把 BCI 用在社交而非战斗的想象","see":["C01","C02","C03","C12","M03","M05","X01","X23"],"groups":["read"],"eth":{"n":["N2"],"e":3,"why":"读取与操纵合成一体时，「同意」这个概念本身失效——你同意的是被设计过的说服。"},"law":{"j":["J3","J5","J2"],"v":1,"basis":"《个人信息保护法》第28条（情绪识别属敏感个人信息）；EU AI Act 第5(1)(b)；《广告法》第28条","why":"读取侧须单独同意，说服侧本身不禁止；一旦构成「实质性扭曲行为」，在欧盟直接违法，在中国按虚假广告与消保法处理——同一行为跨境定性不同。"},"cases":["R24"],"kits":["K02","K06","K16"]},{"id":"X25","g":"X","fn":"OASIS（对照项）","work":"《头号玩家》","desc":"头显 + 触觉服 + 全向跑步机，高沉浸但完全非侵入","flow":"—","lv":1,"lvs":"L1","basis":"现实 VR 已接近；不经过脑","note":"放进表里做对照组：不碰脑也能相当沉浸，反过来削弱了必须开孔的必要性","see":["C04","C05","C19","M01","M02","M17","M18","M21"],"groups":["immersion"],"eth":{"n":["N6"],"e":0,"why":"不碰脑的对照组：伦理负担仅限常规平台治理，恰好证明「不必侵入也能沉浸」。"},"law":{"j":["J5","J8"],"v":1,"basis":"《消费者权益保护法》；《网络安全法》；《著作权法》","why":"纯外设，按消费电子与平台治理处理；是全表法律负担最轻的完整沉浸方案——不碰脑，就绕开了绝大多数神经相关的规制。"},"cases":[],"kits":[]}],"ethics":{"dims":[{"k":"N1","name":"精神隐私","en":"Mental Privacy","q":"谁有权读取你的思想、情绪与记忆？","def":"未经本人有效授权，读取、推断、留存神经活动所承载的心理内容。它与普通个人信息的区别在于：连「尚未说出口的念头」也包含在内，且无法像密码一样更换。","real":"中国《脑机接口研究伦理指引》要求神经数据全流程管理并严守《个人信息保护法》《数据安全法》；UNESCO《神经技术伦理问题建议书》(2025) 把「神经数据」与「可推断心理状态的非神经数据」(眼动、心率、皮电) 一并纳入。","ids":["C01","C04","C10","M01","M02","M05","M17","M22","X01","X05","X16","X20","X21","X22"]},{"k":"N2","name":"认知自由","en":"Cognitive Liberty","q":"谁有权改变你想什么、信什么？","def":"对思想、信念、偏好与注意力的直接干预——写入、抑制或诱导。核心不是「读」，是「改」，且被改的人往往察觉不到。","real":"UNESCO 建议书明确禁止任何明示与暗示的强制使用，并要求保护「思想不可侵犯」；但商业化的诱导式干预（把推荐算法推到神经层）尚无专门规则。","ids":["C03","C05","M04","M07","M13","X08","X18","X20","X24"]},{"k":"N3","name":"自主与能动","en":"Autonomy & Agency","q":"当身体被接管，你还是行为的主体吗？","def":"个体行为由外部主体经由接口直接驱动，本人不参与意志形成，甚至全程不知情。","real":"现行法以「意思表示」为核心，无法处理「身体在动，但不是我在动」。UNESCO 提到身心完整性，但没有对应的责任分配规则。","ids":["C06","C13","M02","M09","M18","M21","X02","X16","X23"]},{"k":"N4","name":"身份与人格","en":"Identity","q":"复制、覆写、分裂之后，哪个是「你」？","def":"个人同一性的断裂或复制：意识快照、副本、覆写、融合、跨介质存续。","real":"全球没有任何法律承认「意识副本」的主体资格。UNESCO 只把「个人身份」列为需保护的价值，未界定其边界。","ids":["C09","C10","C12","C13","C15","C20","M03","M09","M11","M12","X01","X04","X06","X09","X10","X12","X14","X15"]},{"k":"N5","name":"知情同意","en":"Informed Consent","q":"无法表达、无法理解、无法退出的人，怎么同意？","def":"同意有效的三个前提——理解风险、自愿、可随时退出。脑机接口让这三条同时受挑战。","real":"中国指引要求「允许被试在任何阶段无条件退出」；UNESCO 要求对儿童、老年、残障与精神疾病人群禁止任何强制。这是现行规范覆盖最实的一类。","ids":["C01","C02","C09","C11","C14","C16","M01","M02","M07","M08","M13","M14","M16","M18","M19","M21","M22","X10","X12","X13","X16","X19","X21","X23"]},{"k":"N6","name":"平等与可及","en":"Justice","q":"能力可以被购买时，平等还剩什么？","def":"增强造成的能级分层、神经层面的差别对待（神经歧视）、以及可及性不均。","real":"中国指引要求「防止受众与非受众之间的偏见、歧视」；UNESCO 呼吁包容性与可负担性。但全球尚无「神经歧视」的立法先例。","ids":["C02","C03","C16","C17","C18","C19","M04","M10","M15","M20","X09","X11","X13","X17","X25"]},{"k":"N7","name":"责任归属","en":"Accountability","q":"不是你做的，却发生在你身上，谁负责？","def":"被控制行为、系统故障、致死致伤的责任分配——在「人—设备—平台—算法」之间划线。","real":"中国指引要求明确产品服务提供者、研究人员与被试的责任划分，并确保设计/研发/使用/部署全阶段可追责。这是最接近可操作的一条。","ids":["C03","C06","C07","C08","C12","C17","M06","M08","M09","X02","X03","X07","X17","X19","X23"]},{"k":"N8","name":"尊严与商品化","en":"Dignity","q":"人格、意识、身体可以成为资产吗？","def":"把人（或其副本、其脑）当作工具、商品、算力或耗材使用。","real":"禁止奴役与人格商品化有国际人权法基础，但「副本是否受此保护」完全空白——这决定了一整类行为算不算酷刑。","ids":["C04","C05","C09","C11","C13","C14","C18","C19","C20","M11","M14","M19","X06","X09","X10","X11","X13","X14","X15","X17","X21"]},{"k":"N9","name":"数据主权","en":"Data Sovereignty","q":"你的神经数据流向哪里、被谁二次利用？","def":"神经数据的采集范围、存储、跨境流转、二次训练与商业化。","real":"中国指引要求收集范围与查阅权限经伦理委员会审批并全流程保障；UNESCO 要求统一网络安全标准与透明的同意程序。覆盖较实，但「数据用于训练模型」仍属模糊地带。","ids":["C06","C11","C14","M01","M06","X08"]},{"k":"N10","name":"军事化与双用","en":"Dual Use","q":"同一项技术，医疗与武器之间有多远？","def":"军用脑联网、士兵认知增强、审讯与测谎、执法中的强制读取。","real":"国际人道法对「新型作战手段」设有审查义务，但脑机接口未被任何军控条约列名。","ids":["C07","C08","C15","C20","X07"]}],"levels":[{"k":"E0","name":"无伦理争议","c":"#6b7280","def":"不对任何真实主体施加影响，或仅存在于游戏机制内。可以自由实现。","ids":["M20","X25"]},{"k":"E1","name":"有现行规范可依","c":"#16a34a","def":"落在《脑机接口研究伦理指引》、医疗器械审批、《个人信息保护法》或既有网络安全法规之内。照章办事即可。","ids":["C01","C02","C06","C07","M01","M06","M10","M15","M16","M21","M22"]},{"k":"E2","name":"已争议、无共识","c":"#ca8a04","def":"增强 vs 治疗、神经数据商用、职场与教育监测。有争论、有实践、无定论。","ids":["C03","C05","C08","C16","C17","C18","C19","M04","M05","M18","X05","X07","X18","X19","X23"]},{"k":"E3","name":"法律框架无法覆盖","c":"#ea580c","def":"需新设权利或新立罪名（神经权利、神经数据作证据、算法致害）。立法空白已被现实案例触到。","ids":["C04","C11","C12","C14","C20","M03","M08","M14","M17","M19","X02","X08","X11","X13","X16","X21","X22","X24"]},{"k":"E4","name":"触及「人」的定义","c":"#dc2626","def":"前置哲学问题未决（副本是不是本人），任何规范都无从落地。","ids":["C09","C10","C13","C15","M02","M07","M09","M11","M12","M13","X01","X03","X04","X06","X09","X10","X12","X14","X15","X17","X20"]}]},"matrix":[{"lv":"L1","cells":[1,5,0,1,0]},{"lv":"L2","cells":[0,1,4,3,0]},{"lv":"L3","cells":[0,1,9,7,1]},{"lv":"L4","cells":[0,0,0,5,15]},{"lv":"L5","cells":[1,3,0,2,5]},{"lv":"Ln","cells":[0,1,2,0,0]}],"law":{"dims":[{"k":"J1","name":"生命与身体完整","en":"Life & Bodily Integrity","q":"谁的身体被伤害了，伤害到什么程度？","def":"对他人生命、身体、健康的侵害，以及医疗介入的合法性边界。这是唯一一类各国刑法都有对应罪名、无需任何新技术立法的领域。","law":"中国《刑法》第232–235条（故意杀人、故意伤害、过失致人死亡/重伤）、《民法典》第1002–1005条（生命权、身体权、健康权）、第1219–1221条（医疗知情同意与医疗过失）；英美法 battery / negligence；德国 StGB §223、日本刑法第204条。","gap":"「神经层面的损害」在《人体损伤致残程度分级》中没有对应条款，伤残鉴定缺乏尺度；精神障碍能否等同于器质性损伤，各地鉴定实务不一致。","ids":["C03","C05","C06","C08","C09","C12","C13","C17","C19","C20","M02","M05","M08","M09","M10","M16","M17","M22","X07","X16","X19","X23"]},{"k":"J2","name":"人格权与主体资格","en":"Personality & Legal Personhood","q":"谁有资格做权利主体，谁只能算数据？","def":"人格尊严、身份、姓名肖像名誉隐私，以及民事权利能力的起止——后者决定了「副本」「数字人格」在法庭上有没有原告资格。","law":"《民法典》第13条（权利能力始于出生、终于死亡）、第990–992条（人格权不得放弃、转让、继承）、第994条（死者人格利益由近亲属保护）、第1019条（禁止利用信息技术伪造肖像）；德国基本法第1条；《欧洲人权与生物医学公约》(Oviedo) 第1条。","gap":"意识副本、数字人格、人格融合均无主体资格规定。「人格权不得放弃」的绝对性，使一切「事先同意」在处分人格时自动无效——这既是保护的强度，也是制度无法变通的原因。","ids":["C04","C09","C10","C11","C12","C13","C14","C15","C18","M02","M03","M07","M11","M12","M13","M14","M15","M18","M19","M20","X01","X04","X05","X06","X09","X10","X11","X12","X13","X14","X15","X17","X20","X21","X24"]},{"k":"J3","name":"个人信息与神经数据","en":"Neural Data Protection","q":"脑信号算不算个人信息，算哪一类？","def":"神经数据的采集、存储、跨境、二次利用与商业化。它是唯一「无法更换」的凭证类信息——密码可以改，脑波不能。","law":"中国《个人信息保护法》第28条（生物识别、医疗健康属敏感个人信息，须单独同意）、第24条（自动化决策）、《数据安全法》；GDPR 第9条（特殊类别数据）、第22条；美国 Illinois BIPA、加州 SB 1223（2024，将 neural data 列入 CCPA 敏感个人信息，2025-01-01 生效）、科罗拉多 HB24-1058（2024）。","gap":"神经数据是否等同生物识别数据，各地定性不一；「用于训练模型」是否落在原同意范围内，无统一规则；跨境传输没有专门清单。","ids":["C01","C04","C10","C11","C14","C18","M01","M05","M13","M21","M22","X02","X05","X08","X11","X15","X19","X20","X21","X22","X24"]},{"k":"J4","name":"医疗与器械监管","en":"Medical Device Regulation","q":"植入人体之前，谁批准？","def":"植入式器械的上市许可、临床试验、执业资质与伦理审查。这一层不判断「该不该」，只判断「有没有走完程序」。","law":"中国《医疗器械监督管理条例》（植入式属第三类，须注册）、《民法典》第1008条（人体临床试验须伦理审查、书面同意、不得收费）、《涉及人的生命科学和医学研究伦理审查办法》(2023)；EU MDR 2017/745；美国 FDA 21 CFR Part 820 与 IDE 路径。","gap":"「增强」不属于医疗器械定义（诊断、预防、监护、治疗、缓解疾病），增强类植入物没有注册类别——不是被禁止，是无门可进。","ids":["C01","C02","C03","C16","M01","M04","M21","X01","X09","X12","X13","X18"]},{"k":"J5","name":"产品责任与消费者保护","en":"Product Liability","q":"出事了，是产品缺陷还是用户误用？","def":"缺陷产品致害、虚假宣传、格式条款、经营者安全保障义务。「用户同意了」在多数法域不能免除经营者的安全义务。","law":"《民法典》第1202–1207条（产品责任）、《消费者权益保护法》第18条、《产品质量法》、《广告法》第17、28条；EU 产品责任指令 85/374/EEC（2024 修订）；美国 Restatement (Second) of Torts §402A。","gap":"软件与算法更新导致的「产品缺陷」如何认定，尚无统一标准；OTA 升级后的责任是否仍由原制造商承担，各国判例分歧。","ids":["C02","C03","C05","C07","C11","C14","C16","C17","C19","M03","M04","M06","M08","M16","M18","X09","X11","X13","X16","X18","X19","X23","X24","X25"]},{"k":"J6","name":"网络与国家安全","en":"Cyber & National Security","q":"这条链路被攻击，影响的是个人还是基础设施？","def":"未授权入侵、关键信息基础设施、数据出境、出口管制与军事应用。同一段代码，攻击一个人是犯罪，攻击一座电网是危害公共安全。","law":"中国《网络安全法》第21/27/31条、《数据安全法》、《关键信息基础设施安全保护条例》、《出口管制法》；美国 CFAA 18 U.S.C. §1030；EU NIS2 指令；《日内瓦公约第一附加议定书》第36条（新作战手段审查义务）。","gap":"脑机接口未被任何军控条约列名；神经数据出境无专门清单；「自动致死的网络反制」在现行法下无合法位置，但也没有专门条款。","ids":["C06","C07","C08","C15","C18","C20","M06","X08","X17"]},{"k":"J7","name":"刑事归责与证据","en":"Criminal Liability & Evidence","q":"身体在动，但不是我决定的，谁担责？","def":"行为归属、责任能力、共同犯罪、取证合法性与证据能力。这一层决定「有没有被告」，往往比「有没有罪」更关键。","law":"《刑法》第3条（罪刑法定）、第18条（精神病人责任能力）、第25条（共同犯罪须有共同故意）；《刑事诉讼法》第12条（定罪权专属人民法院）、第52条（不得强迫自证其罪）、第150条（技术侦查须批准）；ICCPR 第7、14条。","gap":"「身体被他人控制」在立法上没有免责事由；神经数据作为证据的合法性与证明力标准均未规定；非人主体实施侵害时无被告人。","ids":["C04","C05","C06","C08","C09","C12","C13","C15","C17","C20","M02","M07","M08","M09","M13","M14","M17","X02","X03","X07","X08","X10","X14","X16","X17","X20","X22","X23"]},{"k":"J8","name":"知识产权与竞争","en":"IP & Competition","q":"技能、人格模块、训练数据归谁？","def":"著作权归属、专利适格性、商业秘密与反不正当竞争。植入的内容一旦可复制，权利链条就必须先厘清。","law":"《著作权法》第2、22条；《专利法》第25条（智力活动的规则和方法不授予专利权）；《反不正当竞争法》；EU AI Act 第50条（透明度义务）。","gap":"植入内容的作者认定；人格模块能否作为商业秘密保护；训练数据的授权链条缺乏统一规则。","ids":["M04","M11","M19","X06","X18","X25"]}],"levels":[{"k":"V0","name":"合法","c":"#16a34a","judged":true,"def":"现行法无禁止性规定，也不侵害他人法益。可以直接做，不需要许可。","ids":["C19","M16"]},{"k":"V1","name":"合规可行","c":"#0891b2","judged":true,"def":"现行法允许，但须满足许可、审批、资质或有效同意等要件。不办手续即转为违法——这是「有条件的合法」，不是「默认合法」。","ids":["C01","C02","C04","C07","C16","M01","M03","M05","M06","M18","M21","M22","X05","X13","X16","X19","X22","X23","X24","X25"]},{"k":"V2","name":"违法","c":"#dc2626","judged":true,"def":"现行法有明确禁止性规定或有对应罪名。做了就是违法或犯罪；且同意通常不能作为抗辩（人格权不得放弃、生命不可处分）。","ids":["C06","C08","C09","C13","C18","C20","M02","M14","M17","X02","X07","X08","X17"]},{"k":"V3","name":"无规定","c":"#ca8a04","judged":false,"def":"现行法既未允许也未禁止，缺可适用的规则。本表不作判断。注意：这不等于「合法」——刑事上法无明文不为罪（刑法第3条），民事上却意味着受害者无从主张。","ids":["C03","C05","C10","C11","C12","C14","C15","C17","M04","M07","M08","M09","M11","M13","M19","X01","X04","X06","X09","X10","X11","X12","X14","X15","X18","X20","X21"]},{"k":"V4","name":"不进入评价","c":"#6b7280","judged":false,"def":"行为、主体或后果在法律上无法构成评价对象（物理不可能、无行为主体、纯游戏机制，或本身不是法律行为的社会现象）。本表明确不作判断，也不宜标为合法或违法。","ids":["M10","M12","M15","M20","X03"]}]},"matrixLaw":[{"lv":"L1","cells":[0,5,1,1,0]},{"lv":"L2","cells":[0,5,3,0,0]},{"lv":"L3","cells":[1,8,2,7,0]},{"lv":"L4","cells":[0,1,3,16,0]},{"lv":"L5","cells":[1,0,3,2,5]},{"lv":"Ln","cells":[0,1,1,1,0]}],"cases":{"meta":[{"k":"ic","name":"皮层内植入（读出）","desc":"电极直接进入脑组织，信号质量最高、创伤最大。是「意念控制」这条线的主力，也是长期信号衰减问题最集中的地方。","n":5},{"k":"vi","name":"血管内 / 硬膜外微创","desc":"不穿透脑组织：经血管送支架电极，或把电极贴在硬膜外。牺牲带宽换安全与可及性——这条路最先跑出上市许可。","n":3},{"k":"wr","name":"写入与刺激","desc":"往神经系统里送电：人工耳蜗、DBS、视觉皮层刺激、触觉反馈。这是唯一大规模商业化成功的「写入」类，但也只做成了一件事。","n":8},{"k":"sp","name":"语言与解码算法","desc":"不改进硬件，只改进解码：把运动皮层的放电翻译成音素、词、句子。近两年进展最快的方向。","n":4},{"k":"ni","name":"非侵入（EEG / 诱发电位）","desc":"戴帽子就能用，带宽极低。现实形态不是「读心」，是康复训练的生物反馈与慢速拼写。","n":2},{"k":"rg","name":"监管、支付与立法","desc":"决定一项技术是「实验室成果」还是「可收费的医疗服务」。这一类的进展速度经常快过技术本身。","n":2},{"k":"cs","name":"消费级与灰产","desc":"几百美元的设备、没有临床适应证、指标由厂商自定。它塑造公众对 BCI 的想象，也制造最多的误解。","n":2},{"k":"fl","name":"失败与遗留问题","desc":"对照组不能只列成功。设备停产、公司倒闭、固件漏洞、患者无人维护——这些是植入式器械最真实的风险形态。","n":2}],"list":[{"k":"R01","name":"Neuralink N1 / Telepathy","org":"Neuralink","y":"2024-01 首例 – 2026-10","cat":"ic","ev":3,"what":"64 根柔性线、1024 电极植入运动皮层，颅骨内无线传输。受试者用意念控制光标、下棋、玩射击游戏、操控机械臂，2026-07 起操控电动轮椅。","metric":"全球累计 27 例（2026-10，公司披露）；光标控制 10.39 bit/s；脑信号到光标约 22 ms；打字 40–41 词/分；单台手术电极线植入约 1.5 秒/根","cant":"无同行评议论文；无 FDA 上市许可；刺激通道在临床未启用（纯只读）；首例曾出现约 85% 电极线回缩，靠软件补偿；宣称的「2026 年千例」普遍被视为宣传目标","pin":"「意念控外设」已达产品级可靠性，但机制始终是「读一个意图 → 触发预置动作」，不是作品里的双向总线。","ids":["C01","C02","X01"]},{"k":"R02","name":"VOICE 语音恢复试验","org":"Neuralink","y":"2026","cat":"sp","ev":3,"what":"面向 ALS / 运动神经元病导致构音障碍的患者，解码 attempted speech 合成语音。","metric":"入组 2 例（2026 年中）；与 PRIME、CONVOY 并列为三条在研试验","cant":"样本极小、无公开准确率；语音合成质量与延迟未披露","pin":"语音是「读出」里最成熟的应用，因为说话本身就是运动任务——它有明确的皮层映射，不需要理解语义。","ids":["C02","X01"]},{"k":"R03","name":"Synchron Stentrode","org":"Synchron","y":"2020 – 2026","cat":"vi","ev":3,"what":"经颈静脉把支架电极送进上矢状窦，贴着血管壁采脑电，完全不开颅。受试者用意念发短信、写邮件、网购。","metric":"6 例植入；16 电极；无严重器械相关不良事件；已获 FDA 突破性器械认定与 IDE，确证性试验 2026 年入组，准备首个 PMA 申报","cant":"带宽只有皮层内方案的百分之一量级，做不了精细运动；血管内位置决定它只能「大致听到」，不能「逐个神经元听」","pin":"低创伤与高带宽是一对硬 trade-off。Synchron 走的是「先让人用上」而不是「先让人用得爽」。","ids":["C01","C02"]},{"k":"R04","name":"博睿康 NEO 手部运动代偿系统","org":"博睿康 / 清华","y":"2026-03 获批","cat":"vi","ev":1,"what":"硬脑膜外微创植入 + 无线供能，驱动气动手套完成抓握。全球首个拿到植入式 BCI 三类医疗器械注册证的产品。","metric":"2026-03-13 国家药监局三类证；11 家医院 36 例（4 例可行性 + 32 例多中心），主要终点 100% 达成；2026-07-13 华山医院首例上市后植入；植入部分约两枚硬币大小，无内置电池","cant":"只代偿「抓握」一个动作；适应证限 C2–C6 颈段脊髓损伤 A–C 级、病程 >1 年且稳定 ≥6 个月；无感觉反馈；设备本身尚未纳入全国医保统筹","pin":"这是全表最重要的一条现实锚：BCI 第一次从「科研成果」变成「可收费的医疗器械」，而它做到的事只有一件——让人握住杯子。","ids":["C02","C16","M05"]},{"k":"R05","name":"北脑一号","org":"芯智达 / 北京脑科学与类脑研究所","y":"2025 – 2026","cat":"vi","ev":3,"what":"半侵入式 μECoG 电极贴敷硬膜外，覆盖脊髓损伤、脑卒中偏瘫、渐冻症三类适应证。有患者实现支具辅助下独立行走。","metric":"全部 36 例入组完成，进入观察与康复期；安全运行总时长 >5.5 万小时；计划 2027 年申报三类证","cant":"仍属注册临床，未获批；长期电极稳定性与居家使用数据未公开","pin":"中国在这一轮的位置不是追赶者：全球第一张植入式 BCI 注册证、最大规模的在体运行小时数都在国内。","ids":["C02","X01"]},{"k":"R06","name":"脑虎科技「三全」系统","org":"脑虎科技 / 华山医院","y":"2021 – 2026","cat":"ic","ev":3,"what":"全植入、全无线、全功能：柔性皮层电极 + 埋入式主机。患者可居家使用，2026-06 完成上海—南昌 800 km 跨城脑控象棋对弈。","metric":"IIT 累计 57 例（2026-05）；全链路延时 <50 ms；一名 29 岁高位截瘫美术教师恢复绘画与自主进食；2026-07 进入创新医疗器械特别审查并启动注册临床；江西赣江新区建万套级产线","cant":"仍为 IIT + 注册临床，未获批；「全功能」指多任务，不等于高带宽；量产与成本未验证","pin":"「全植入无线」意味着没有穿过皮肤的导线——这是把植入体从「病房设备」变成「个人设备」的门槛，比带宽更关键。","ids":["C01","C02","X23"]},{"k":"R07","name":"BrainGate / Utah 阵列","org":"Brown / MGH / Stanford 等联盟","y":"2004 – 2026","cat":"ic","ev":2,"what":"最早、最长的侵入式 BCI 人体系列。瘫痪者用意念控制光标、机械臂自喂食、操作 CAD 软件。","metric":"20 年以上人体数据；T5 受试者 90 字符/分；2025 年 Nature Neuroscience 报告 22 词/分、错误率 1.6%；多篇同行评议论文","cant":"每例都需开颅、经皮导线（后期改无线）；信号随胶质瘢痕逐年衰减；受试者数量始终在数十人量级","pin":"所有「意念打字」的原始数据都来自这一条线。它证明了原理，也用二十年证明了「衰减」这个工程死结。","ids":["C02","M05"]},{"k":"R08","name":"Precision Neuroscience Layer 7","org":"Precision Neuroscience","y":"2025 – 2026","cat":"ic","ev":1,"what":"1024 电极薄膜阵列，经颅骨上一个小切口滑入硬膜下，贴在皮层表面。设计上就是为了能取出。","metric":"2025 年 FDA 510(k) 许可，但仅限术中临时使用（最长 30 天）；已完成 37 例术中记录","cant":"不是长期植入；30 天之外无适应证；表面电极信号分辨率低于穿透式","pin":"「可摘除」不是作品里的设定，是已经拿证的商业模式——它绕开了「植入即终身」这个最大的伦理与法律包袱。","ids":["C01","C16"]},{"k":"R09","name":"Paradromics Connexus","org":"Paradromics","y":"2025-11 – 2026-06","cat":"ic","ev":3,"what":" microwire 方案，2026-06 完成首例永久性皮层内植入，目标适应证为重度言语障碍的语音恢复。","metric":"2025-11 获 FDA IDE；2026-06 首例永久植入；计划 2 例起步","cant":"样本仅个位数；长期安全性未知；语音输出指标未公布","pin":"四家侵入式公司在同一年抢「首例」，说明瓶颈已经不是科学，是临床资源与审批排期。","ids":["C01","X18"]},{"k":"R10","name":"UC Davis 语音神经假体（Casey Harrell）","org":"UC Davis / BrainGate","y":"2023-07 植入 · 2024 NEJM · 2025 Nature","cat":"sp","ev":2,"what":"4 个微电极阵列（共 256 电极）植入左侧前中央回，解码「试图说话」时的运动指令，输出文字并用患者 ALS 前的录音合成他自己的声音。","metric":"准确率最高 97%；50 词表 30 分钟训练达 99.6%；125,000 词表约 90.2%；32 周内 84 次会话、累计 >248 小时","cant":"只对「曾经会说话、构音器官运动指令仍可发出」的人有效；需要每天校准；设备本身仍是实验性","pin":"这是「读出」类最漂亮的结果：不是读心，是读「他想怎么动嘴」。语义是语言模型补出来的，不是从脑子里读出来的。","ids":["C02","X01"]},{"k":"R11","name":"UCSF 语音 + 数字分身","org":"UCSF（Edward Chang 团队）","y":"2023 – 2026","cat":"sp","ev":2,"what":"同时解码唇、下颌、舌的运动，驱动一个会做表情的虚拟形象说话，语音用患者原声建模。","metric":"接近 80 词/分；可生成喜、悲、惊讶等面部表情","cant":"表情是动画映射，不是「读出了情绪」；仍属单例研究","pin":"作品里「脑内影像直接外化」的最近现实对标物。区别在于：它输出的是预设动画参数，不是主观体验。","ids":["C02","X01","C04"]},{"k":"R12","name":"Stanford 内言语解码","org":"Stanford（Frank Willett 团队）","y":"2025-08","cat":"sp","ev":2,"what":"解码「只在心里说、完全不动嘴」的内言语，并设计「想法密码」——必须先默想一句特定短语，系统才解锁。","metric":"内言语 74% 准确率（125,000 词表）；想法密码可靠度 98.75%","cant":"74% 离可用很远；内言语信号幅度小、个体差异大；只在少数电极受试者上验证","pin":"「精神隐私」从伦理议题变成工程事实的第一个节点：技术第一次证明，不说话也能被读出一些东西。","ids":["C04","X20","M22"]},{"k":"R13","name":"湘雅医院侵入式视觉重建","org":"中南大学湘雅医院","y":"2026","cat":"wr","ev":3,"what":"全国首例侵入式视觉重建手术。失明近 20 年的患者术后可在室内定向行走、躲避障碍物。","metric":"单例；可完成室内导航与避障","cant":"光幻视级，不是图像；不能阅读、不能识别人脸；长期稳定性未知","pin":"视觉重建的现实目标是「别撞到墙」，而作品里的目标是「看清世界」。两者之间是分辨率与编码理论的双重鸿沟。","ids":["C02","X01"]},{"k":"R14","name":"Neuralink Blindsight","org":"Neuralink","y":"2024-09 认定 – 2026-11","cat":"wr","ev":4,"what":"绕过眼球与视神经，直接刺激视觉皮层产生光幻视。2024-09 获 FDA 突破性器械认定。","metric":"厂商 2026-10 宣称首例盲人受试者已能感知并定位光点；但截至 2026-11-02，ClinicalTrials.gov 无任何 Blindsight 试验登记，亦无同行评议数据；公司与监管方均未公布试验方案","cant":"分辨率低到「稀疏光点」；先天盲者能否把电刺激理解为「看见」无任何证据；「最终超越自然视觉、看见红外」属远期宣称","pin":"同一件事存在「厂商称已成功」与「公开登记查无试验」两种说法。对照组的第一条纪律就是：把宣称和证据分开摆放。","ids":["C02","X01"]},{"k":"R15","name":"人工耳蜗","org":"多厂商（Cochlear / AB / MED-EL 等）","y":"1970s – 至今","cat":"wr","ev":1,"what":"把声音的频谱分析后映射成耳蜗内电极的刺激脉冲，让听神经「听到」电信号。儿童在语言习得关键期植入可接近正常语言发展。","metric":"全球累计 >100 万例；电极数 12–24 个；是唯一大规模、跨代际、商业化验证成功的神经「写入」设备","cant":"音乐欣赏普遍很差；噪声环境言语识别明显下降；电极数决定了它能携带的信息量上限","pin":"五十年、一百万例，只做成了一件事：把频谱塞进二十来个电极。这是「写入」类想象最诚实的天花板参照。","ids":["C02"]},{"k":"R16","name":"DBS 脑深部刺激（帕金森 / 特发性震颤）","org":"多中心临床 · 多家厂商","y":"1997 获批 – 至今","cat":"wr","ev":1,"what":"电极植入丘脑底核或苍白球，持续或自适应电刺激，显著改善震颤、僵直与运动迟缓。闭环 DBS 可感知局部场电位自动调参。","metric":"全球累计 >20 万例；闭环 DBS 已获监管批准；术后程控参数需长期随访调整","cant":"改善的是运动症状，不改变疾病进程；对认知与言语可能有副作用；「刺激哪、刺激多少」仍靠试错而非模型","pin":"「往脑里写电」最大的临床成功，但写的是「抑制一个核团」，不是「写一段内容」。位置对了就有效，内容根本不需要。","ids":["C02","X18"]},{"k":"R17","name":"DBS 治疗难治性抑郁","org":"多中心（BROADEN 等）","y":"2013 – 2026","cat":"wr","ev":2,"what":"针对胼胝体下扣带束等靶点的个体化刺激，有个案达到长期缓解；但大型随机对照试验（BROADEN）2017 年因无效中止。","metric":"个案缓解报道持续出现；无大型 RCT 阳性结果；部分中心转向个体化靶点与闭环方案","cant":"群体层面未证明有效；靶点选择高度个体化；安慰剂效应与病程自然波动难以分离","pin":"同一个机制（电刺激改变情绪），在运动障碍上是金标准，在抑郁上是争议。技术能到的地方，不等于疗效成立的地方。","ids":["C05","X18"]},{"k":"R18","name":"脑-脊髓接口 / 数字桥","org":"EPFL / CHUV（Courtine 团队）","y":"2023 Nature – 2025","cat":"wr","ev":2,"what":"皮层信号实时解码后刺激腰椎脊髓的背根区域，绕过损伤节段，让瘫痪者重新站立、行走、上下楼梯。","metric":"2023 年 Nature 首例报告；后续升级为完全植入式系统；训练后可自主控制步态","cant":"需要长期训练与辅助；疲劳后性能下降；对完全性脊髓损伤的适用范围有限","pin":"这是「义体控制」的现实版最接近成功的一条：不是替换肢体，是把断掉的线接回来。作品里从没认真写过这条路径。","ids":["C02","X23"]},{"k":"R19","name":"双向触觉反馈义肢","org":"多中心（Blackrock / 匹兹堡大学等）","y":"2015 – 2025","cat":"wr","ev":2,"what":"机械手的触觉传感器信号转成皮层微刺激，受试者能分辨物体粗糙度、判断抓握力度，「感觉手是自己的」。","metric":"可分辨粗糙/光滑与力度等级；抓握成功率与速度提升；部分受试者报告「 embodied 感」增强","cant":"只有几个离散的触觉通道；无法传递温度、纹理细节、疼痛；长期植入稳定性未解决","pin":"全表唯一「双向」已有真实人体数据的一类。但双向 ≠ 全双工：是 2–4 个通道进去，几十个通道出来。","ids":["C02","M05"]},{"k":"R20","name":"PRIMA 光伏视网膜下植入","org":"Pixium Vision / 多中心","y":"2025-10 NEJM","cat":"wr","ev":2,"what":"把光伏阵列植入视网膜下，用眼镜投影红外图像驱动电极，残余视网膜通路的患者恢复部分中心视力。","metric":"38 例干性 AMD 地图样萎缩患者，多项视力指标改善（NEJM 2025）","cant":"只适用于视网膜通路尚存者；分辨率低；需配合外置眼镜","pin":"视觉假体有两条路：刺激视网膜（用残余通路）和刺激皮层（绕开通路）。前者已验证，后者才是「盲人复明」的路径。","ids":["C02"]},{"k":"R21","name":"非侵入 BCI 康复门诊（卒中后偏瘫）","org":"中国康复研究中心 / 天坛医院等","y":"2025 – 2026","cat":"ni","ev":3,"what":"戴电极帽、涂导电膏、做运动想象，脑电触发外设或功能性电刺激辅助训练。已成为标准化流程。","metric":"预训练 15–20 分钟 + 正式训练 30 分钟，单次约 45 分钟；天坛医院 2025-03 开全国首个 BCI 门诊，两个月 800 余人预约、年底累计评估 >1600 例；全国 20 余省 >50 家医院开设 BCI 门诊/病房/中心","cant":"适应证窄（传统康复进入平台期的患者）；疗效依赖训练频次；无法用于健康人增强","pin":"非侵入 BCI 在现实中的主战场不是「读心」，是「让大脑重新学会指挥瘫痪的手」。它是康复科，不是科幻。","ids":["C02","C16"]},{"k":"R22","name":"SSVEP 稳态视觉诱发电位拼写器","org":"多实验室 / 开源社区","y":"2000s – 至今","cat":"ni","ev":2,"what":"注视不同频率闪烁的方块，枕区脑电出现同频响应，据此判定注视目标，逐字母选择。","metric":"熟练用户 20–60 字符/分（文献区间）；需数小时训练；长时间使用易疲劳、光敏性癫痫为禁忌","cant":"必须盯着闪烁界面；无法在移动或说话时使用；个体差异极大（约 1/5 用户「BCI 盲」）","pin":"这就是「意念打字」在非侵入路线上的真实速度：比你用手指打字慢一个数量级，而且眼睛必须一直盯着屏幕。","ids":["C02","M05"]},{"k":"R23","name":"消费级 EEG 头环","org":"多家（Emotiv / Muse / BrainCo 等）","y":"2010s – 至今","cat":"cs","ev":4,"what":"干电极头环，输出「专注度」「放松度」「睡眠分期」等分数，可做注意力训练、冥想引导、简单意念开关。","metric":"价格约 200–800 美元；通道数 1–14；无需医疗器械审批（按健康/娱乐类宣称）","cant":"指标为厂商自定算法，未经临床量表验证；干电极信噪比极低；每次使用需重新校准；「意念控制」实际是几个粗分类","pin":"消费级 BCI 卖的不是带宽，是「一个可以显示的数字」。它塑造了公众对 BCI 的想象，也制造了最多的误解。","ids":["C02","X18"]},{"k":"R24","name":"情绪识别与神经营销","org":"广告与 HR 技术行业","y":"2015 – 至今","cat":"cs","ev":1,"what":"用摄像头微表情、语音韵律、皮电、心率估计情绪状态，用于广告效果测试、客服质检、面试筛选、课堂注意力分析。","metric":"已规模商用；EU AI Act 第 5 条禁止工作场所与教育场景的情绪识别（2025 起分阶段适用）；中国《个人信息保护法》第 28 条将情绪识别归入敏感个人信息","cant":"「情绪」是从外周信号推断的统计量，不是读到了感受；跨文化、跨个体准确率差异大；已有多地立法限制","pin":"X24「读取情绪用于说服」的现实版根本不碰脑——这削弱了整个「必须植入」的想象惯性。这是全表最重要的一处认知纠正。","ids":["X24","C18"]},{"k":"R25","name":"神经数据立法","org":"Colorado / California / Minnesota 等","y":"2024 – 2026","cat":"rg","ev":1,"what":"把 neural data 明确纳入敏感个人信息或生物识别数据，赋予访问、更正、删除与索赔权利。","metric":"加州 SB 1223（2024 签署，2025-01-01 生效）将 neural data 列入 CCPA 敏感个人信息；科罗拉多 HB24-1058（2024）；明尼苏达提出民事与刑事罚则；智利 2021 年宪法修正案已确立「神经权利」","cant":"只管「数据」，不管「意识」；不解决人格权能否处分；跨境规则缺失","pin":"立法速度常常快过技术——因为「把一类数据加进清单」不需要等技术成熟。这是法律维度里唯一主动跑在前面的部分。","ids":["C04","X05","M22"]},{"k":"R26","name":"医保立项与收费编码","org":"国家医保局 / 各省级医保","y":"2025-03 – 2026","cat":"rg","ev":1,"what":"为「侵入式脑机接口置入/取出」「非侵入式脑机接口适配费」单独立项价格项目，各省出台收费细则。","metric":"2025 年国家医保局立项；全国 20 余省出台细则；侵入式置入费 6000–6600 元/次；上海将 NEO 耗材纳入医保医用耗材目录，沪惠保最高保障 15 万元","cant":"只是手术服务费，设备本体尚未进入全国统筹报销；「适配费」如何按次计费仍在摸索","pin":"判断一项技术是否真的落地，看它有没有收费编码——这比任何论文都硬。","ids":["C19","C16"]},{"k":"R27","name":"起搏器与胰岛素泵的漏洞与召回","org":"Abbott / Medtronic / FDA","y":"2017 – 2020","cat":"fl","ev":1,"what":"联网植入式设备的固件可被未授权修改。2017 年 Abbott 因安全问题召回约 46.5 万台起搏器并推送固件更新，2019 年 Medtronic 因类似问题召回。","metric":"单次召回规模数十万台；FDA 已建立植入式器械网络安全上市前审查要求；多款胰岛素泵有公开漏洞通告","cant":"这些设备不接脑，但架构与 BCI 完全同构：无线 + 固件 + 远程程控 + 生命支持","pin":"Quickhack/黑冰的现实版已经发生过，只是目标不是人脑。它是「联网植入式医疗器械安全」这个问题的直接祖先，也是全表最该被认真对待的一条。","ids":["C06","C07","M06","X02","X07","X08"]},{"k":"R28","name":"Argus II 停产与 Second Sight 退场","org":"Second Sight Medical Products","y":"2011 上市 – 2020 停产","cat":"fl","ev":1,"what":"视网膜假体，全球逾 350 名盲人植入。公司 2020 年停止生产、后被收购，植入者失去配件、维修与软件支持渠道。","metric":"全球 >350 例植入；分辨率约 60 像素；停产后部分患者设备无法维修，等于「留在体内的砖」","cant":"设备寿命短于患者寿命；无强制「遗产维护」义务；患者无从索赔","pin":"「设备寿命 = 患者寿命」是植入式 BCI 最现实的法律与伦理问题，而且已经真实发生过一次。任何「植入即终身」的想象都必须先回答这个问题。","ids":["C16","C19","C11"]}]},"compose":{"tiers":[{"k":"A","name":"现货可拼","c":"#16a34a","def":"所有部件商业可得，不需要医疗器械审批，不需要新论文。今天下单、几周内能做出原型——门槛是工程与产品，不是科学。","n":8},{"k":"B","name":"需器件与审批","c":"#0891b2","def":"部件齐全，原理已验证，但要过临床、拿注册证、建产线。6–36 个月，卡的是审批与成本，不是原理。","n":7},{"k":"C","name":"技术成立·制度未开","c":"#ca8a04","def":"工程上已经能做，但没有合法路径：没有适应证可报、没有收费编码、或直接被现行法禁止。这一档的问题不在实验室，在会议室。","n":5}],"list":[{"k":"K01","name":"神经自适应难度（Playtest 的现实版）","tier":"A","parts":["消费级 EEG 头环（专注/唤醒度）","心率带（HRV）","摄像头表情识别","游戏引擎的难度曲线接口"],"how":"把多路生理信号融合成一个 0–1 的「紧张度」标量，映射成敌人数量、光照、音效密度。玩家越怕，系统越吓——闭环在软件层完成，不需要任何神经写入。","have":"R23 消费级 EEG、R24 情绪识别；生物反馈类游戏已有十年以上商业产品","blocker":"没有技术阻塞。唯一的问题是「用生理信号调难度」未必比「按表现调难度」更好玩。","ids":["X19"],"gap":"作品是植入体读恐惧信号并实时生成恐怖场景；现实是用心率与表情调参数。差别不在效果，在「读的是情绪还是情绪的外周影子」。","verdict":"今天就能做，且不需要 BCI。这是全表最容易被高估的一类想象——它的现实版早已存在，只是没人叫它脑机接口。"},{"k":"K02","name":"疲劳与分心监测","tier":"A","parts":["EEG 头环（θ/α 比、P300 衰减）","眼动仪（PERCLOS 闭眼率）","方向盘握力 / 键盘节奏","车载或工位告警"],"how":"三路信号取「谁先越阈值」，任一触发即降级（减速、锁屏、提醒休息）。多模态融合把单路的误报率压下来。","have":"商用 DMS（驾驶员监控系统）已在多国强制装车；工地与矿山有成熟方案","blocker":"无。但「神经」只是其中一路信号，摄像头往往贡献更大。","ids":["C18","X24"],"gap":"作品里这类能力总是「植入体持续读脑」；现实是「戴个帽子 + 一个摄像头」，且只在工作时段。","verdict":"已商用。它证明了一件事：监控类需求从来不需要最高带宽，只需要「够用的一个数字」。"},{"k":"K03","name":"意念开关（智能家居）","tier":"A","parts":["SSVEP 拼写器原理","4–8 个不同频率的闪烁图标","智能家居网关（MQTT / Matter）"],"how":"注视某个图标 → 枕区出现同频响应 → 判定选择 → 发出开关指令。本质是把「注视」当成鼠标点击。","have":"R22 SSVEP；开源 BCI 硬件与 Python 工具链","blocker":"每次操作 2–4 秒，误触率高；强光环境失效；比说一句话慢十倍。","ids":["C02","M05"],"gap":"作品里是「想一想灯就亮」，现实是「盯着一个闪烁的方块看三秒」。前者是意图直连，后者是视觉诱发电位的副作用。","verdict":"能，但没有理由用。这是「技术上可行」与「产品上成立」之间最典型的一道沟。"},{"k":"K04","name":"无创沟通板（ALS / 闭锁综合征）","tier":"A","parts":["EEG P300 / SSVEP","眼动追踪","预测输入法（语言模型）","TTS + 个人音色克隆"],"how":"眼动做粗定位、EEG 做确认，语言模型补全整词，TTS 用患者术前录音合成。三件套叠起来能把 5 字符/分提到 15 字符/分。","have":"R22；商用 AAC（辅助沟通）设备已是成熟品类","blocker":"速度天花板低；晚期 ALS 患者眼球运动也会丧失，那时只能退回 EEG 单通道。","ids":["C02","X01"],"gap":"作品默认「想什么就输出什么」；现实是「逐字母选，靠模型猜你想说什么」。","verdict":"能，且已经在救人。它是非侵入路线唯一有明确临床价值的产品形态。"},{"k":"K05","name":"睡眠闭环刺激","tier":"A","parts":["消费级 EEG","慢波（0.5–2 Hz）实时检测","短声 / 经颅电刺激","睡眠分期模型"],"how":"检测到慢波上升相时播放 50 ms 短音，试图增强慢波幅度。闭环延迟要求 <100 ms。","have":"多家消费产品已上市；学术上重复验证过「能增强慢波」","blocker":"「增强慢波」≠「改善睡眠」：多项 meta 分析效应量小且不一致；对主观睡眠质量的影响争议大。","ids":["C02","C16"],"gap":"作品里的睡眠相关设定多是「强制入睡 / 梦中学习」，两者都无机制；现实只做到「在正确的时刻放一声」。","verdict":"能做到「精准地在某个脑波相位给一个刺激」，做不到「改善你的睡眠」。这是测量与干预之间的经典落差。"},{"k":"K06","name":"注意力定价与神经营销","tier":"A","parts":["眼动仪","微表情识别","皮电 / 心率","点击流与停留时长"],"how":"把「看没看、看了多久、什么表情」拼成注意力质量分，反推广告出价与内容排序。全程不接触神经系统。","have":"R24；广告技术行业标准做法","blocker":"不是技术，是合规：EU AI Act 第 5 条禁止工作场所与教育场景的情绪识别；中国《个人信息保护法》第 28 条将情绪识别列为敏感个人信息。","ids":["X24","C18"],"gap":"X24 的 CASIE 是「植入体读神经信号，实时给出说服策略」。现实版读的是脸和手指，效果却已经足够好用。","verdict":"全行业已在做，且完全不涉及植入。这一条是对整个「必须开颅才能读人」想象惯性的直接反驳。"},{"k":"K07","name":"脑信号 → 图像重建（读梦的粗糙版）","tier":"A","parts":["fMRI / 高密度 EEG","对比学习（脑活动 ↔ 图像嵌入）","扩散模型（Stable Diffusion 类）"],"how":"先训练一个把脑活动映射到 CLIP 嵌入空间的编码器，再用扩散模型按嵌入生成图像。2023 年 Nature 的经典范式。","have":"2023 年起多篇论文；语义层面（这是猫/这是建筑）可辨，像素层面不成立","blocker":"需要受试者配合注视数千张图做训练；只能重建「类别」与「大致构图」；fMRI 无法移动、时间分辨率秒级。","ids":["C04","X21","X22"],"gap":"作品是「进入他人记忆，看到完整第一人称画面」；现实是「在磁共振里看 5000 张图，然后生成一张神似的示意图」。","verdict":"能重建语义，不能重建体验。这一条最容易被媒体报道夸大成「读梦成功」，实际上离「超梦」还差一个主观体验的维度。"},{"k":"K08","name":"神经数据合规工具链","tier":"A","parts":["动态同意管理","数据分级与最小化","删除权与撤回的技术实现","审计日志与跨境网关"],"how":"把「同意—使用—撤回—删除」做成可执行的状态机，每一次神经数据流转都留痕。技术上就是一套数据治理中间件。","have":"R25 立法、R26 收费编码；GDPR / 个保法已有成熟合规范式","blocker":"无技术阻塞。难点是「神经数据」的边界尚未统一，同一段信号在不同法域分类不同。","ids":["C14","X05","M22"],"gap":"作品里从不写合规；但现实里这一层决定后面所有功能能不能上线。","verdict":"现在就该做。它是唯一「不做则其余全部无法合法落地」的一类——也是本表最不性感、最重要的一条。"},{"k":"K09","name":"意念控外设（光标 / 轮椅 / 机械臂）","tier":"B","parts":["1024 通道皮层电极或硬膜外电极","无线供能与数据传输","意图解码模型","安全急停与失败降级"],"how":"运动皮层的群体放电 → 速度/方向向量 → 映射成光标位移或关节角度。关键是「松手即停」的安全设计。","have":"R01 Neuralink 27 例、R04 NEO 已拿三类证、R05 北脑一号 36 例、R07 BrainGate 二十年数据、R06 脑虎 57 例","blocker":"长期信号衰减（胶质瘢痕）、开颅风险、单例成本、术后随访负担。","ids":["C02","M05","C01"],"gap":"作品里是「想动就动，还能超频」；现实是「想一个动作，等 20 毫秒，屏幕上动一下」，且只有少数几个自由度。","verdict":"2026 年已是器械级能力，全球第一张植入式 BCI 注册证就发在这一类。但适应证只到「抓握」与「移动光标」。"},{"k":"K10","name":"自然语速语音合成","tier":"B","parts":["高密度皮层电极（语音运动区）","音素/音节解码","大语言模型纠错","个人音色克隆 TTS"],"how":"解码「试图说话」时唇、舌、下颌、喉的运动指令 → 音素序列 → 语言模型消歧 → 合成语音。LLM 在这里的作用是「猜」，不是「读」。","have":"R10 UC Davis 97%、R11 UCSF ~80 词/分并带表情分身、R02 Neuralink VOICE、R09 Paradromics","blocker":"只对「曾会说话」的人有效；每天需校准；植入本身的风险不变。","ids":["C02","X01"],"gap":"作品里语音是「脑内独白直接外放」；现实是「读出运动指令 + 模型补全语义」。前者是读心，后者是读嘴。","verdict":"已接近自然对话速度。这是近三年 BCI 最实在的进展，也是「读出」类唯一跑通商业逻辑的方向之一。"},{"k":"K11","name":"光幻视人工视觉","tier":"B","parts":["视觉皮层电极阵列","眼镜摄像头","刺激编码（把图像降维成电极序列）"],"how":"摄像头取图 → 降采样成 N 个点的亮度 → 对应电极发放脉冲 → 皮层产生 N 个光点。用户需要学习「读懂」这些点。","have":"R20 PRIMA（视网膜下，已验证）、R13 湘雅（皮层，单例）、R14 Blindsight（宣称，无公开试验登记）","blocker":"光点拼不成图像：皮层不是规则显示屏，同样电流在不同人、不同位置产生不同形状；先天盲者没有视觉经验可供匹配。","ids":["C02","X01"],"gap":"作品里是「义眼分辨率超过人眼，还能看红外」；现实是「几十个光点，够你躲开墙」。","verdict":"能产生光感，不能产生视觉。这是全表「宣称与证据落差最大」的一类，媒体标题与论文结论经常差着两个量级。"},{"k":"K12","name":"闭环触觉反馈义肢","tier":"B","parts":["多自由度机械手","触觉/力传感器","皮层微刺激或外周神经刺激","实时闭环控制"],"how":"抓握时的压力与滑动信号 → 刺激体感皮层 → 患者感到「手在用力」。闭环让抓握从「看着调」变成「感着调」。","have":"R19；多项同行评议研究，受试者可分辨粗糙度与力度等级","blocker":"只有 2–4 个离散触觉通道；温度、纹理、疼痛无法传递；长期电极稳定性未解决。","ids":["C02","M05"],"gap":"作品里义体手感与原生手无差别，甚至更强；现实是「能分出粗糙和光滑」，且只在实验室里。","verdict":"全表唯一「双向」已有真实人体数据的一类。但双向 ≠ 全双工：2–4 个通道进去，几十个出来。"},{"k":"K13","name":"脑-脊髓数字桥","tier":"B","parts":["皮层电极","实时解码器","脊髓背根刺激阵列","步态相位模型"],"how":"皮层发出的行走意图 → 解码成刺激参数 → 直接刺激损伤下方的脊髓节段 → 腿部肌肉按正确时序收缩。绕过了断点。","have":"R18 EPFL/CHUV，2023 Nature 首例，2025 升级为全植入","blocker":"需长期训练；疲劳后性能下降；完全性损伤的适用边界不清。","ids":["C02","X23"],"gap":"作品里的「义体控制」默认替换肢体；现实最成功的路径是「修复线路」。这条路径在虚构里几乎没被认真写过。","verdict":"已能让瘫痪者站立行走。这是「读出 + 写入」闭环里最完整的一条工程实现。"},{"k":"K14","name":"闭环 DBS（运动与情绪）","tier":"B","parts":["深部电极","局部场电位感知","自适应调参算法","无线程控"],"how":"实时读取靶点附近的异常振荡（如帕金森的 β 波段），按需给刺激，而不是全天恒定输出。省电、副作用更少。","have":"R16 帕金森闭环 DBS 已获监管批准；R17 抑郁方向仍无大型 RCT 成功","blocker":"「刺激哪里、刺激多少」仍靠试错；精神科适应证缺乏可复现的靶点与生物标志物。","ids":["C05","X18"],"gap":"作品里的情绪调节是「装个模块就变一个人」；现实是「调参数，可能有效，也可能没用」。","verdict":"运动症状成立，情绪症状未证明。同一个机制在两类疾病上的命运完全不同——这是「技术能到 ≠ 疗效成立」最好的例子。"},{"k":"K15","name":"记忆写入与认知增强","tier":"B","parts":["海马体多电极阵列","群体编码模型","刺激回放"],"how":"在大鼠与猴身上，研究者能用「记忆的群体编码」做输入输出替换，甚至改善任务表现。人体上只有少量癫痫患者的电极机会。","have":"动物实验为主；人体仅零散病例研究","blocker":"「记忆的编码格式」未知——这是 L2 级理论缺口，不是工程缺口。不知道要写什么，通道再多也没用。","ids":["C16","M04","X18"],"gap":"作品里的技能下载是「一个文件拷进脑子」；现实连「一段记忆存在哪、以什么格式存」都还没有答案。","verdict":"做不到，且短期内看不到路径。这一条必须明确划出去——把它算进「现有科技可组合」，整份清单的可信度就没了。"},{"k":"K16","name":"职场神经监控","tier":"C","parts":["消费级 EEG 头环","注意力/疲劳模型","HR 与排班系统","绩效看板"],"how":"技术上与 K02 完全同构，只是把场景从驾驶舱搬到工位，把输出从「提醒休息」换成「记录专注度」。","have":"R23、R24；已有矿业与长途运输的合规监控先例","blocker":"不是技术，是法律：EU AI Act 第 5 条禁止工作场所情绪识别；中国《个人信息保护法》第 24 条禁止自动化决策的不合理差别待遇；劳动法对劳动者人格权的保护构成另一道墙。","ids":["C18","X24"],"gap":"作品里叫「人性值」，是赛博朋克的招牌设定；现实里它叫「员工专注度分析」，而且大部分法域不允许。","verdict":"做得出来，且在很多国家已经违法。这是「技术成熟度」与「合法可用性」背离最明显的一条。"},{"k":"K17","name":"植入体远程固件更新与远程程控","tier":"C","parts":["植入体","BLE / MICS 无线链路","OTA 升级","云端随访平台"],"how":"医生在门诊或云端调整刺激参数、推送固件补丁。起搏器与神经刺激器已经这样运行了二十年。","have":"R27；起搏器远程监测是标准配置，也因此出现过数十万台规模的召回","blocker":"架构上无法同时做到「可远程更新」与「不可被远程滥用」。这是设计取舍，不是能修好的 bug。","ids":["C06","C07","M06"],"gap":"作品里的 Quickhack 是「黑客无线入侵神经义体」；现实里这条链路已经存在，只是目标还是心脏和脊髓，不是大脑。","verdict":"已是标准配置。换句话说：C06 的技术前提早就具备，缺的只是「把电极插进脑」这一步——而 NEO 已经做到了。"},{"k":"K18","name":"植入体 + 大模型的「外挂记忆」","tier":"C","parts":["语音转文字","个人知识库检索","LLM 摘要","骨传导耳机 / AR 眼镜"],"how":"听→转写→检索→把答案推回耳朵或镜片。全链路不需要任何神经接口，只需要一个一直在听的麦克风。","have":"消费级 AI 眼镜与录音笔已实现 80% 的功能","blocker":"输出端到不了脑内：没有可靠的非侵入写入通道，所有「提示」只能走眼睛和耳朵。","ids":["C16","X18","M04"],"gap":"作品里是「脑内直接弹出知识卡片」；现实是「眼镜上飘一行字」。差别只在那最后十厘米，但那十厘米恰好是全部难度所在。","verdict":"能做成一幅很好用的眼镜，做不成「脑内搜索框」。这一条最清楚地标出了「读出容易、写入极难」的分界线。"},{"k":"K19","name":"双向 BCI + 云端算力（云脑）","tier":"C","parts":["植入体","边缘计算单元","云端推理","低延迟回传"],"how":"把重计算放到云端，植入体只做采集与刺激。理论上可以让一个低功耗植入体获得巨型模型的算力。","have":"R06 脑虎全链路 <50 ms 已是国内最好水平；R01 脑到光标 22 ms","blocker":"往返延迟：神经环路本身 10–20 ms，公网往返 50–200 ms。且断网即失效——把生命支持交给云是不被接受的架构。","ids":["C01","X01","C03"],"gap":"作品里的「网络空间」是无延迟的；现实的网络永远有延迟，而且延迟就是安全边界。","verdict":"能做「辅助」，做不到「延伸」。任何把关键环路放到云上的设计，在医疗器械审评里都会被要求加本地降级路径。"},{"k":"K20","name":"神经数据作为证据","tier":"C","parts":["EEG / ERP 采集","事件相关电位分析","测谎或「记忆识别」算法","司法鉴定流程"],"how":"给嫌疑人呈现特定刺激，看是否出现 P300 或「有记忆」特征波。技术上能测出「这个信息对他有特异性」。","have":"多国做过探索性研究；商业「脑指纹」产品曾出现","blocker":"科学效度不足（假阳性率高、可被对抗措施干扰）；《刑事诉讼法》第 52 条不得强迫自证其罪；神经数据的证据能力无任何标准。","ids":["M22","X22","C04"],"gap":"作品里（M22、X22）读脑是可靠的侦查手段；现实里它连「能不能作为线索」都还没定。","verdict":"技术上能测，法律上不能用。这是「技术可行」被证据规则挡在门外的典型。"}]},"groups":[{"key":"upload","name":"意识上传 · 数字永生","desc":"把心智复制或转移到非生物基底，以及由此引出的同一性问题。七种作品立场全部集中在 L4，分歧在哲学而不在工程。","ids":["C09","C10","C11","C13","C14","C15","C20","M11","M12","X04","X06","X09","X10","X11","X12","X13","X14","X15"]},{"key":"immersion","name":"全感官沉浸 · 虚拟世界","desc":"用模拟流顶替或叠加感官输入。硬连线插孔、培养舱全接管、非侵入 FullDive、纯外设头显走了四条不同路径。","ids":["C04","C05","C19","M01","M02","M17","M18","M21","X05","X16","X19","X23","X25"]},{"key":"write","name":"写入 · 技能 / 记忆 / 信念","desc":"往脑里写内容，是全部想象中编解码缺口最大的一类：硬件通道数可以堆，但「往哪儿写」没有理论。","ids":["C16","M04","M07","M13","X18","X20","X21","X22"]},{"key":"security","name":"神经安全 · 被入侵","desc":"接口一旦联网，攻击面就自动出现。本质上是联网植入式医疗器械的安全问题，也是全表最易实现的一类想象。","ids":["C06","C07","C08","C20","M06","M08","M09","X02","X07","X08"]},{"key":"read","name":"读出 · 义体 / 替身","desc":"从脑里解码意图并驱动外部装置，现实里已有临床雏形（脑控机械臂、光标、语音合成）。","ids":["C01","C02","C03","C12","M03","M05","X01","X23","X24"]},{"key":"network","name":"脑联网 · 群体意识","desc":"多个脑直连成网络，个体边界、同步机制与隐私是核心难题。","ids":["M19","X01","X03","X17"]},{"key":"rules","name":"时间 · 物理规则操纵","desc":"主观时间加速与改写模拟规则，多数属叙事装置而非技术。注意与义体生理加速区分。","ids":["C03","M10","M15","M16","M20"]},{"key":"society","name":"副作用 · 商业与伦理","desc":"成瘾、人格解体、付费来世、数字人格权利——技术之外的代价，常比技术设定更锋利。","ids":["C05","C11","C17","C18","M14","X10","X11","X14"]}],"glossary":[{"key":"engram","term":"engram 印迹","aliases":["印迹","Engram"],"def":"把一个人的记忆、言语模式与行为倾向数字化后的副本。《赛博朋克 2077》明确设定它没有主体意识、会随时间劣化——这正是 Soulkiller 这个名字的反讽所在。","ids":["C10","C11","C13","C20","X06"]},{"key":"soulkiller","term":"Soulkiller 灵魂杀手","aliases":["灵魂杀手","Soulkiller"],"def":"Alt Cunningham 于 2013 年编写的程序：扫描并复制心智进网络，同时摧毁原生大脑。它是「方法」，Relic 是载体，Mikoshi 是存放地，三者常被混为一谈。","ids":["C09","C15","C20"]},{"key":"relic","term":"Relic 生物芯片","aliases":["Relic","生物芯片"],"def":"荒坂的可植入生物芯片，存储 engram 并可写入宿主神经系统；原型还能用纳米技术修复脑损伤、并逐步覆写宿主人格。不只是硬盘，还是主动写入装置。","ids":["C11","C12","C13","C16"]},{"key":"mikoshi","term":"Mikoshi 神舆","aliases":["神舆","Mikoshi"],"def":"荒坂存放 engram 的服务器 / 数字监狱，Alt 曾被囚于此。存储数据不难，难的是硬盘里那个「人」。","ids":["C14","C15","C09"]},{"key":"blackwall","term":"Blackwall 黑墙","aliases":["黑墙","Blackwall"],"def":"隔离旧网中失控 AI 的防火墙。作为网络隔离 / air-gap 工程上平凡；「墙后 AI 会吞噬人脑」是设定。","ids":["C07","C15","C20"]},{"key":"braindance","term":"Braindance 超梦","aliases":["超梦","Braindance"],"def":"录制并回放他人完整第一人称感官 + 情绪 + 生理状态，可剪辑、多视角。祖型是《神经漫游者》的 Simstim（实时直播版）。","ids":["C04","C05","C19","X05","X16"]},{"key":"quickhack","term":"Quickhack 快速破解","aliases":["快速破解","Quickhack"],"def":"网络行者无线入侵他人神经义体。本质是联网植入式设备的安全攻防，是全表里最可能被先验证的想象。桌游时代反而必须用缆线直连。","ids":["C06","C08","X02","X07"]},{"key":"neurolink","term":"神经接口 Neural Link","aliases":["Neural Link","神经接口"],"def":"颈后 / 头部插槽，所有义体的通用中枢总线。现实中不存在跨厂商通用插槽，每个植入体都是专用系统。","ids":["C01","C02","M01"]},{"key":"cyberpsycho","term":"赛博精神病","aliases":["赛博精神病","Cyberpsychosis"],"def":"义体过载导致人格解体与暴力倾向。属叙事 / 社会学装置，不是技术实现目标，用来给义体容量上代价。","ids":["C17","C18","C19"]},{"key":"matrix","term":"Matrix 矩阵","aliases":["矩阵","Matrix"],"def":"机器建造的全感官模拟，顶替人的全部感官输入并接管运动输出。核心不是「接口」，是「替代」。","ids":["M01","M02","M14","M17","M21"]},{"key":"rsi","term":"残余自我影像 RSI","aliases":["RSI","残余自我影像"],"def":"人在 Matrix 里的形象由「自我形象」字段决定，与真实肉体不同。解释了拔除后 Neo 秃头苍白、Matrix 里却有头发。","ids":["M03"]},{"key":"construct","term":"Construct 构造体","aliases":["构造体","Construct"],"def":"空白白色训练空间，可加载技能程序（I know Kung Fu）。现实运动技能靠反复练习，无「写入复杂动作程序」的理论。","ids":["M04","M18","X18"]},{"key":"redpill","term":"红药丸 / 蓝药丸","aliases":["红药丸","蓝药丸"],"def":"其实是两个操作：中断追踪程序并唤醒（易），以及抹掉记忆、植入替代人生（极难）。常被误当成「吃颗药」。","ids":["M07","M13","M06"]},{"key":"cyberbrain","term":"电子脑 Cyberbrain / Ghost","aliases":["电子脑","Cyberbrain","Ghost"],"def":"《攻壳机动队》里大脑直接联网、全身义体化；Ghost 是区别于数据的自我，引出「换完身体我还是我吗」的连续性问题。","ids":["X01","X02","X03","X04"]},{"key":"cortical","term":"皮质栈 / DHF","aliases":["皮质栈","DHF"],"def":"《碳变》里颈后植入存储完整人格，换体如换衣，栈被毁才是「真死」。设定默认「复制＝本人」，比 CP2077 武断。","ids":["X09"]},{"key":"cookie","term":"Cookie 意识副本","aliases":["cookie","Cookie"],"def":"《黑镜》里扫描出有完整主观体验的副本，可被奴役、可被加速承受「百年孤独」——数字人格权利问题的核心设定。","ids":["X10","X11","X14"]},{"key":"fulldive","term":"FullDive 全潜行","aliases":["FullDive","NERvGear"],"def":"《刀剑神域》的非侵入头盔读脑 + 阻断本体感觉 + 全感官写入。最大虚构点：无创设备达到侵入式全带宽。","ids":["X16","X15"]},{"key":"wbe","term":"全脑仿真 / 意识上传","aliases":["全脑仿真","意识上传","WBE"],"def":"按突触级扫描并模拟全脑。2025 年《State of Brain Emulation Report》定为 TRL 1–2、至少 30–40 年；另有基底依赖与副本问题。","ids":["C09","M12","X12","X13","X14"]},{"key":"bandwidth","term":"带宽瓶颈","aliases":["带宽瓶颈","带宽"],"def":"语音约 39 bit/s；顶尖植入 1024 电极对约 860 亿神经元。这是所有「全沉浸」想象最硬的一堵墙。","ids":["C04","M01","M02","X16","X25"]},{"key":"bidirectional","term":"双向 BCI / 写入","aliases":["双向 BCI","全双工"],"def":"现实人体植入目前以只读为主，刺激（写入）刚进小规模试验，且不知道往哪儿写。虚构几乎都假设全双工随意写。","ids":["C02","C06","M04","X19","X23"]},{"key":"copy","term":"副本问题 / 主体连续性","aliases":["副本问题","延续性谬误","主体连续性"],"def":"复制一个行为完全相同但无主观体验的东西，算不算让你活下去？CP2077 与《SOMA》回答「不算」，《碳变》《万神殿》默认「算」。","ids":["C10","C13","M11","M12","X09","X10","X12","X13"]},{"key":"substrate","term":"基底依赖","aliases":["基底依赖","基底"],"def":"意识是否只能由生物组织产生。若成立，数字上传只会得到功能模仿品而非有体验的主体；目前无实证判据。","ids":["C10","X12","X14","M11"]}],"works":[{"key":"CP2077","name":"赛博朋克 2077 体系","sub":"桌游源流 · 游戏本体 · 往日之影 · 边缘行者","intro":"重点作品之一。它的脑机设定最特别的地方不是技术多炫，而是自己承认 engram 不是本人——Soulkiller 这个名字就是反讽。Relic / Soulkiller / Mikoshi / Blackwall / engram 是五个不同层次的东西，务必分清。","list":["Cyberpunk 2020 / Cyberpunk RED · 桌游，旧网、缆线直连、ICE 黑冰、人性值","Cyberpunk 2077 (2020) · 游戏本体，主设定来源","Phantom Liberty / 往日之影 (2023) · Relic 2.0 技能树、高塔结局","Cyberpunk: Edgerunners / 边缘行者 (2021) · 动画，义体堆叠与赛博精神病","Edgerunners 第二季 (2026) · Soulkiller 军备竞赛与 Capri（据 2026 年报道整理，以剧集实际设定为准）"],"ids":["C01","C02","C03","C04","C05","C06","C07","C08","C09","C10","C11","C12","C13","C14","C15","C16","C17","C18","C19","C20"]},{"key":"Matrix","name":"黑客帝国全系列","sub":"4 电影 · Animatrix 9 短片 · 3 游戏 · 漫画 · 技术演示","intro":"重点作品之二。核心不是「接口」而是「替代」：用模拟流完整顶替全部感官输入 + 接管运动输出，且终身不间断。一个物理插孔承载全感官全双工，是把现实里成千上万通道的难题藏进了一个洞里。","list":["The Matrix (1999) · 电影","The Matrix Reloaded (2003) · 电影","The Matrix Revolutions (2003) · 电影","The Matrix Resurrections (2021) · 电影","Animatrix ① Final Flight of the Osiris (2003)","Animatrix ② The Second Renaissance Part I","Animatrix ③ The Second Renaissance Part II","Animatrix ④ Kid's Story","Animatrix ⑤ Program","Animatrix ⑥ World Record","Animatrix ⑦ Beyond","Animatrix ⑧ A Detective Story","Animatrix ⑨ Matriculated","Enter the Matrix (2003) · 游戏，与 Reloaded 并行叙事","The Matrix: Path of Neo (2005) · 游戏，重述三部曲","The Matrix Online (2005–2009) · MMO，2009 关服","The Matrix Comics (1999–2003) · 官网连载短篇","The Matrix Awakens (2021) · UE5 交互式技术演示"],"ids":["M01","M02","M03","M04","M05","M06","M07","M08","M09","M10","M11","M12","M13","M14","M15","M16","M17","M18","M19","M20","M21","M22"]},{"key":"GITS","name":"攻壳机动队","sub":"士郎正宗漫画 · 1995 剧场版 · S.A.C. · 2017","intro":"把「自我」问题摆到台面正中：电子脑直连网络、全身义体化之后，Ghost 还是不是我。与 CP2077 的 engram 构成正反对照。","list":["士郎正宗《攻壳机动队》漫画","押井守《攻壳机动队》(1995) 剧场版","《攻壳机动队 S.A.C.》(2002–2005) 电视动画","《攻壳机动队》(2017) 真人电影"],"ids":["X01","X02","X03","X04"]},{"key":"Cyberpunk","name":"神经漫游者 / 雪崩","sub":"威廉·吉布森 1984 · 尼尔·斯蒂芬森 1992","intro":"赛博朋克的源头文本。Simstim 是超梦的祖型，Dixie Flatline 几乎就是 CP2077 的 engram；黑冰 ICE 被桌游 2020 直接继承。","list":["《神经漫游者》Neuromancer (1984)","《雪崩》Snow Crash (1992)"],"ids":["X05","X06","X07","X08"]},{"key":"Carbon","name":"碳变 / 副本","sub":"Richard Morgan 小说 · Netflix S1","intro":"设定默认「复制＝本人」，栈即身份。是 C10（CP2077 否定复制＝复活）最干净的反例。","list":["《副本》Altered Carbon 小说","Netflix《碳变》第一季"],"ids":["X09"]},{"key":"BlackMirror","name":"黑镜 / 上载新生","sub":"White Christmas · San Junipero · USS Callister · Playtest","intro":"把技术难题包装成消费与权利问题：cookie 被奴役、数字来世按带宽收费、神经植入式恐怖游戏。伦理上最锋利的一组。","list":["《黑镜》White Christmas","《黑镜》San Junipero / USS Callister / Playtest","《上载新生》Upload"],"ids":["X10","X11","X19"]},{"key":"SOMA","name":"SOMA / 万神殿 / 西部世界","sub":"Frictional Games 2015 · 2022 动画 · HBO","intro":"《SOMA》对「复制≠转移」讨论最彻底；万神殿默认 UI 就是本人，两者立场相反。《西部世界》难得地把「保真度验证」写进了设定。","list":["《SOMA》(2015) 游戏","《万神殿》Pantheon 动画","《西部世界》Westworld"],"ids":["X12","X13","X14"]},{"key":"SAO","name":"刀剑神域 / 心理测量者","sub":"Alicization · 西比拉系统","intro":"一个是非侵入 FullDive 却要求侵入级带宽；一个把活体大脑并联成群体裁决计算机，是脑联网最极端的想象。","list":["《刀剑神域》SAO / Alicization","《心理测量者》PSYCHO-PASS"],"ids":["X15","X16","X17"]},{"key":"Games","name":"Prey / Deus Ex / ID: INVADED","sub":"神经模块 · 社交增强 · 读脑场景化","intro":"游戏与动画里把「写入」做得最可操作的三例：可安装/卸载的技能模块、用于说服的神经读数、把读心换成读场景以绕开编解码难题。","list":["《Prey》(2017)","《Deus Ex: Human Revolution》(2011)","《ID: INVADED》"],"ids":["X18","X22","X24"]},{"key":"Films","name":"盗梦空间 / 源代码 / 阿凡达 / 头号玩家","sub":"共享梦境 · 记忆残响 · 远程替身 · 非侵入对照","intro":"《头号玩家》是重要对照组：不碰脑也能做到相当沉浸，反过来削弱了「必须绕过感官器官直达大脑」这个想象惯性。","list":["《盗梦空间》Inception","《源代码》Source Code","《阿凡达》Avatar","《头号玩家》Ready Player One"],"ids":["X20","X21","X23","X25"]}],"hot":[{"key":"GITS","name":"攻壳机动队","sub":"士郎正宗漫画 1989– · 押井守剧场版 1995 · S.A.C. 2002–2005 · 2017 真人版","deep":true,"cat":"","hot":"赛博朋克动画的公认坐标。押井守 1995 剧场版把「Ghost / 躯壳」之问推入主流；S.A.C. 的笑脸男单元至今仍是「网络时代公众事件如何被制造」的最佳教科书，新作与联动持续在产出。","profile":"舞台是 2030 年前后的日本：大脑可以直接联网（电子脑），身体可以整具替换（义体），只剩脑壳里那颗原装大脑还算「自己」。公安九课的少校素子就是这条路线走到底的人，全剧都在问：换到最后，Ghost 还在不在。它是《黑客帝国》沃卓斯基公开承认的直接灵感来源。","core":[{"t":"电子脑 Cyberbrain（X01）","lv":"L4","d":"大脑直连网络，颅骨外壳即防火墙。现实无线植入带宽只够打字级，且无人敢把大脑这样暴露在网络上。"},{"t":"电子脑入侵 / 笑脸男（X02）","lv":"L3","d":"通过视觉通道实时劫持他人感知，让目击者「看不见」关键人物。视觉皮层刺激在现实有雏形，但这种实时全人群劫持是 L3。"},{"t":"Stand Alone Complex（X03）","lv":"L5","d":"没有原版的模仿犯在网络上自发涌现——网络化大脑带来的社会级副作用想象，属世界观规则而非技术。"},{"t":"素子 × 傀儡师融合（X04）","lv":"L5","d":"两个数字/生物心智合为一体并各自存续，直接跳过副本问题给出浪漫解，科学上无从讨论。"}],"scenes":["全身义体化：肉体能换的都换了，剧情仍把「大脑原装」当作人格最后的锚。","Ghost 异常检测：义体医生反复确认「这孩子有没有 Ghost」——作品明说 Ghost 无法用任何仪器验证，这正是它的论点。","笑脸男事件：一个黑客同时劫持所有在场者的电子脑视觉，制造「完美犯罪」与全社会模仿犯。","塔奇克马：AI 战车比人类更有人味，反向追问「人格到底是什么」。"],"real":"电子脑等于把大脑直接变成联网终端。现实里侵入式植入需开颅、带宽只够光标与打字、信号数月就衰减；「同时劫持一群人的视觉」需要每人都有高带宽视觉写入通道——差着好几个范式级突破。","vs":"《黑客帝国》(1999) 的颈后接口、绿色代码雨与「意识进入网络空间」的视觉语言直接承自 1995 攻壳。攻壳的 Ghost 立场与 CP2077「engram 无主体意识」同属「自我不可复制」阵营：素子最后选择与傀儡师融合而非被复制，就是 refusal 的浪漫版。","ids":["X01","X02","X03","X04"],"cks":["cyberbrain","copy"]},{"key":"SAO","name":"刀剑神域","sub":"川原砾小说 2009– · A-1 Pictures 动画 2012– · Alicization 2018–","deep":true,"cat":"","hot":"FullDive 想象在中文圈最有名的载体。SAO 篇定义了一代人对「完全潜行游戏」的想象，Alicization 篇则把意识复制、灵魂翻译推到 L5 深水区。","profile":"NerveGear 头盔阻断本体感觉、向神经系统写入全感官信号，玩家意识整体进入虚拟世界。Alicization 篇换成 Soul Translator：用高密度扫描把「摇光」（灵魂架构）翻译出来，甚至能复制出一个有主观体验的人。","core":[{"t":"FullDive 全潜行（X16）","lv":"L3","d":"非侵入头盔实现全感官读写。最大虚构点：无创设备达到侵入式全带宽——颅骨外的信号信噪比差着数量级。"},{"t":"摇光 / STL 灵魂翻译（X15）","lv":"L5","d":"把灵魂当作可翻译、可复制的数据结构。属范式之外的世界观规则，但它是「意识＝信息」立场的极端化演示。"}],"scenes":["死亡游戏：摘头盔即被微波烧毁大脑——用肉体死亡锁死「退出」这个安全阀。","GGO 篇意识转移：意识瞬间迁移到另一台设备，跳过物理传输的想象。","Under World：摇光在其中经历 200 年主观时间，出来说明「模拟中的时间加速」会直接压垮心智。","爱丽丝·滋贝鲁库：复制出的摇光带着完整人格与记忆被带走，本体仍在 Under World——作品明确把它当「绑架」处理。"],"real":"现实非侵入路线（EEG/fNIRS/经颅刺激）带宽与定位精度都只够简单指令；阻断本体感觉与全感官写入均无从谈起。「复制出的意识算不算人」目前没有任何判据，作品替观众做了情感裁决。","vs":"对照《黑客帝国》：Matrix 选侵入插孔，SAO 选非侵入头显——SAO 的路径用户更省事，物理上却更不可能。对照 CP2077：超梦是「录像回放」，FullDive 是「现场直播自己」，前者 L3 后者也是 L3，但 SAO 的摇光复制直接撞上 L5。","ids":["X15","X16"],"cks":["fulldive","bandwidth","copy"]},{"key":"BlackMirror","name":"黑镜","sub":"Channel 4 → Netflix 选集剧 2011– · White Christmas / San Junipero / USS Callister / Playtest 等","deep":true,"cat":"","hot":"把「数字人格」拍成消费与法律问题的选集剧，热度长年不减。它不关心 BCI 硬件，只关心一件事：如果副本有你全部的主观体验，你对它负什么责任。","profile":"每集独立。与脑机相关的三集构成一条完整链条：White Christmas 造出可被奴役的意识副本，San Junipero 问数字来世归谁所有，Playtest 把神经植入变成商业恐怖游戏。","core":[{"t":"Cookie 意识副本被奴役（X10）","lv":"L4","d":"扫描出有完整主观体验的副本，可被加速、可被拷问。「数字人格权利」问题的核心设定。"},{"t":"数字来世付费分层（X11）","lv":"L4","d":"云端永生按订阅收费，穷人有穷人的服务器。把上传的市场化后果演成正文。"},{"t":"神经植入式恐怖游戏（X19）","lv":"L3","d":"植入体读取恐惧信号并实时生成恐怖场景——读出 + 生成闭环，L3 且是全剧最接近现实游戏技术的一集。"}],"scenes":["White Christmas：把副本的主观时间调到 1000 年/分钟用来逼供——「加速主观时间」是全系列最狠的想象。","San Junipero：死后意识上传进度假小镇，每周限时体验。","Playtest：现实恐惧被读取后放大回灌，玩家被自己的神经信号吓死。"],"real":"Cookie 需要无创获取完整主观体验——现有任何扫描手段都远达不到；「主观时间加速」没有神经科学机制。真正已现雏形的是 Playtest 一类：用生理信号驱动自适应恐怖游戏，无需 BCI 用心率/皮电也能做。","vs":"CP2077 把「数字人格权利」放在文案与支线里，黑镜直接把它拍成正剧并推到法律场景。《黑客帝国》问机器为何造 Matrix，黑镜只问人如何对待数字人——社会性最强，技术设定最含糊。","ids":["X10","X11","X19"],"cks":["cookie","copy","substrate"]},{"key":"Pantheon","name":"万神殿","sub":"动画 2022–2023 · 改编自刘宇昆《The Perfect Match》等短篇","deep":true,"cat":"","hot":"近年把「意识上传」讲得最完整的动画：不只问能不能，还把上传后的劳动力市场、公司所有权、AI 战争全部推演了一遍，2023 年完结后讨论度持续走高。","profile":"渐冻症工程师 David Kim 被公司秘密全脑扫描，成为上传智能 UI。公司随后把 UI 当算力资产：雇去跑金融模型、设计产品、充当武器。故事的核心冲突不是技术，是所有权——公司认为买断了那个「人」。","core":[{"t":"上传智能 UI / 渐冻（X13）","lv":"L4","d":"突触级全脑扫描＋模拟。默认「复制＝本人」，与 CP2077 立场正相反。"}],"scenes":["UI 被公司雇去做高频交易与设计——「意识」第一次被当作纯算力资产定价。","感知瓶颈：UI 没有身体，需要喂入海量感官流才不疯，反证了「意识离不开心身耦合」。","UI 之间的战争与联盟：数字人格的世界同样长出政治。"],"real":"2025 年《State of Brain Emulation Report》把全脑仿真定为 TRL 1–2、至少 30–40 年：目前只完成果蝇连接组，人脑约 860 亿神经元 / 约 100 万亿突触。「扫描的人还是本人」无任何实证判据。","vs":"与《碳变》同属「复制＝本人」阵营，与 CP2077 / SOMA 正面相撞——同一个技术动作，两种哲学答案。它独有的是把 CP2077 只在背景里暗示的「荒坂靠 engram 盈利」拍成了主线：上传的第一个应用是剥削。","ids":["X13"],"cks":["wbe","copy","substrate"]},{"key":"Carbon","name":"碳变 / 副本","sub":"Richard Morgan 小说 2002 · Netflix 剧集 2018–","deep":true,"cat":"","hot":"「换体如换衣」设定的代表作，Netflix 化后热度破圈。它把意识上传的伦理问题用最粗暴的方式砍掉了：栈即身份，复制即本人，没什么好争的。","profile":"人的意识存在颈椎后的皮质栈里，死后栈可保存数百年，随时压入新义体（Sleeve）。穷人租尸体，富人养「备份义体仓库」，被抓前自动远程备份——永生按财富分层。","core":[{"t":"皮质栈 + DHF + 换体（X09）","lv":"L4","d":"完整人格数字化存储、跨躯体传输、无损写入新脑。写入端（往生物脑里写一个人格）没有任何理论路径。"}],"scenes":["双份意识审讯：把同一个人的栈装进两个义体同时审讯，事后合并——官方承认副本也是「他」。","「真死」定义：只有栈被物理摧毁才算死。","义体妓院与器官市场：意识可迁移后，身体沦为可更换硬件的社会学推演。"],"real":"DHF（数字人传）要把约 100 万亿突触状态压进指甲盖芯片，再无损写入另一个发育完成的人脑——两步都无理论。栈本身倒有个低配现实对应物：脊髓刺激电极确实放在颈椎附近，但那只是刺激运动通路，不存任何东西。","vs":"与 CP2077 的 Relic 是最直接的一对：同为「芯片承载人格」，Relic 至少承认覆写宿主的是会劣化的 engram 空壳；碳变则干脆默认复制＝本人，设定比 CP2077 武断。它还是 X10（CP2077 否定复制＝复活）最干净的反例。","ids":["X09"],"cks":["cortical","copy","substrate"]},{"key":"SOMA","name":"SOMA","sub":"Frictional Games · 2015 · 恐怖游戏","deep":true,"cat":"","hot":"把「复制≠转移」演得最疼的作品，常年被列为意识上传话题的必玩/必读。别的作品讨论副本问题，SOMA 让你亲身体验两次——每次都以玩家的视角醒来，发现「我」没走成。","profile":"海底站 WAU 用认知结构复制维持「人类」存续：扫描你的大脑，把副本装进仿生躯壳，本体原地被抛下。玩家角色 Simon 每次扫描都以为自己会「过去」，醒来却发现醒来的永远是副本，本体留在黑暗里。","core":[{"t":"脑扫描 → 仿生躯壳 / 延续性谬误（X12）","lv":"L4","d":"扫描即复制，复制即另起一个主体。作品不设彩蛋，把延续性谬误做成核心玩法与恐怖感来源。"}],"scenes":["第一次复制：Simon 醒来在 2104 年的深海底站，80 年过去了——「转移」从未发生，只是有人替他继续活着。","发射方舟：把几十个复制心智送上天，留在地上的人目送——一次集体性的延续性处刑。","Catherine 的头：只剩数字大脑的同伴，两人的每次对话都在演示「基底不同，体验不同」。"],"real":"现实所有「上传」方案本质上都是复制；「转移」没有技术路径，甚至没有可操作定义——什么算「同一个人」搬过去了，哲学上无判据。SOMA 的诚实之处在于不假装有。","vs":"比 CP2077 更彻底：V 和 Johnny 还能在同一颗脑子里对话，SOMA 里每次复制都是一次哲学处刑，无人幸免。与《黑客帝国》构成两极：Matrix 用「你以为的真实」骗肉体，SOMA 用「你以为的转移」骗灵魂。","ids":["X12"],"cks":["wbe","copy","substrate"]},{"key":"Neuromancer","name":"神经漫游者 / 雪崩","sub":"威廉·吉布森 1984 · 尼尔·斯蒂芬森 1992","deep":true,"cat":"","hot":"赛博朋克的源头文本：cyberspace、ICE、Simstim 这些词全从这来，CP2077 与黑客帝国的设定家谱都能追溯到它。2026 年前后影视化消息不断，讨论度回潮。","profile":"《神经漫游者》：过气黑客凯斯带着「死去」搭档的 ROM 人格、为神秘雇主攻破巨型企业 AI。《雪崩》：提出 Metaverse 与「语言即病毒」——把虚拟空间和 MEME 攻击两个概念提前了三十年。","core":[{"t":"Simstim 模拟刺激（X05）","lv":"L3","d":"以他人视角直播感官体验——超梦 Braindance 的直系祖型。"},{"t":"Dixie Flatline（X06）","lv":"L4","d":"死去的黑客被存成 ROM 芯片，只保留人格行为模式、无意识——几乎就是 CP2077 的 engram，而且同样承认「里面没有人」。"},{"t":"黑冰 ICE / 缆线直连（X07）","lv":"L2","d":"入侵防御系统与神经接驳。桌游 Cyberpunk 2020 直接继承 ICE 与缆线设定，传到 CP2077。"},{"t":"Metaverse + Snow Crash 病毒（X08）","lv":"L5","d":"街道级虚拟空间＋通过语言/图像黑进人脑的病毒——后者是纯世界观规则。"}],"scenes":["凯斯的「舱体」：泡在营养液里接缆线冲网络——CP2077 网络行者与黑客帝国培养舱共同的视觉祖先。","Dixie 芯片：「我死了，别再叫我醒来」——虚构作品第一次认真写「ROM 里的人格算不算活着」。","Straylight 决战：两个 AI（Wintermute / Neuromancer）欲合为一体，比攻壳傀儡师早十年。","Metaverse 的 The Street：头号玩家 OASIS 与一切元宇宙产品的祖型。"],"real":"缆线直连反而在 2026 年比无线更「严谨」：有线物理隔离是现实安全基线（air-gap），桌游时代要插线、游戏时代无线的演进正好和安全趋势相反。ICE→黑冰→Blackwall 是一条被完整继承的设定链。","vs":"CP2077 的 engram ≈ Dixie Flatline，Mikoshi 囚禁 engram 的设定 ≈ Neuromancer 囚禁人格的虚拟囚笼（认出这点的人很多，但 Straylight 本来就是「ROM 狱」的放大版）。黑客帝国的训练构造体与吉布森的 cyberspace 一脉相承。","ids":["X05","X06","X07","X08"],"cks":["braindance","bandwidth","quickhack"]},{"key":"Westworld","name":"西部世界","sub":"HBO 2016–2022 · 四季","deep":true,"cat":"","hot":"把「人造意识」从制造拍到解放再到扩散的剧集，第四季干脆让人类自己住进他人编好的剧本——热度争议都大，但「保真度测试」这一段设定在全表里独一份。","profile":"host 的意识存在「心智核心」里，可复制、可备份、可重置。人类用它造主题公园；剧情后半，host 的心智被装进人类身体，复制体与本体并存，验证「副本是不是他」成了剧情本身。","core":[{"t":"host 心智核心 / 保真度测试（X14）","lv":"L4","d":"全表唯一把「复制品还是不是他」工程化的作品：用重复访谈逐句比对回答，误差收敛即视为保真。"}],"scenes":["伯纳德复制德洛丽丝心智：逐条访谈校准，「你听到的声音是最真实的吗」——把哲学问题做成了 QA 流程。","心智球：意识可以攥在手里的物理形态。","第四季：人类城市本身就是一座更大的西部世界——控制权反转。"],"real":"保真度测试是个真问题：现实如果有了人格副本，验证「像不像」只能靠行为比对，西部世界给出的恰是目前唯一可操作的方法——尽管它无法回答主观体验是否被复制。心智球则是纯叙事：现有存储密度差十几个数量级。","vs":"与 CP2077 的 Mikoshi 同为「数字监狱」，但西部世界写了验证与校准协议，Mikoshi 只写了关押。与《黑客帝国》Resurrections 的「循环重启世界」互为镜像：一边是 host 重写人类剧本，一边是机器重写人类历史。","ids":["X14"],"cks":["copy","wbe"]},{"key":"Inception","name":"盗梦空间","sub":"克里斯托弗·诺兰 · 2010","deep":true,"cat":"","hot":"「写入」主题的国民级作品：不改硬件、不打插孔，全靠叙事把「往人脑里植入一个想法」讲成了影史经典。多层梦境与时间膨胀的设定被讨论了十几年。","profile":"团队通过镇静剂共享梦境，在梦中偷取机密（extraction）或反过来植入想法（inception）。植入必须让目标觉得想法是自发产生的——这是全片对「写入」最准确的直觉：硬塞的会被抗拒，长出来的才稳定。","core":[{"t":"共享梦境 / 植入意念（X20）","lv":"L4","d":"多人进入同一层梦境并修改其中人的认知。「精准植入复杂意念且不自知」没有任何现实路径。"}],"scenes":["三层梦境＋limbo：镇静越深，层数越深，主观时间越长。","时间膨胀：每深一层约 ×20——现实梦境时间感知最多拉长约 20–100%，方向对但量级是叙事需要。","图腾与「你的大脑把它当成真实」：与《黑客帝国》「什么是真实」是同一个问题。"],"real":"现实最近的两块碎片：定向记忆激活（TMR，睡眠中重放线索以加固/影响特定记忆）与清醒梦诱导——都只能「推一把」，不能「装进去」一个完整想法。共享梦境则完全虚构：梦境无法从外部调度成同一剧本。","vs":"它把《黑客帝国》「大脑把模拟当成真实」的设定反向使用：Matrix 骗你一生，盗梦空间骗你一层。与 CP2077 的写入系条目（技能芯片 C16、Relic 覆写 C11）同属 M→B 流向，但诺兰明确选了「软写入」——通过经验与暗示完成，反而绕开了编解码难题。","ids":["X20"],"cks":["bidirectional"]},{"key":"RPO","name":"头号玩家","sub":"史蒂文·斯皮尔伯格 · 2018 · 原著 Ernest Cline 2011","deep":true,"cat":"","hot":"全球票房 6 亿美元的虚拟世界大片，也是本表最重要的对照组：它证明了不碰大脑也能做成十亿人平台——直接给「必须 BCI 才能全沉浸」的想象惯性降了温。","profile":"2045 年，人类在 OASIS（纯外设 VR：头显、触觉手套、全向跑步机）里工作、社交、上学、打金币。没有一根线插进任何人的脑子。","core":[{"t":"OASIS（对照组，X25）","lv":"L1","d":"全表唯一的 L1 大型想象：消费级 VR + 触觉外设，现实正在追赶，且已部分实现。"}],"scenes":["触觉手套：手指动作与触感反馈——现实已有力反馈手套原型。","全向跑步机＋动捕套装：身体仍是控制器，感官仍是输入端。","绿洲键与商业闭环：虚拟世界的经济绑定现实身份——元宇宙构想的完整预告片。"],"real":"这是全表里唯一一条「现实跑在虚构前面」的线：消费级头显、6DoF 追踪、力反馈手套、社交 VR 全部存在。它的沉浸上限由感官器官决定——分辨率、视场角、触觉保真度都是外设工程问题，所以才是 L1。","vs":"对两部重点作品都是反衬：《黑客帝国》的插孔路线假设「绕过感官器官直达神经」才有真沉浸，OASIS 证明感官层就能卖票，只是上限低；《SAO》的 FullDive 是它的 L3 升级幻想。如果未来真建成十亿人的「Matrix 式」平台，工程上更可能是 OASIS 形态，而不是给每人开颅。","ids":["X25"],"cks":["bandwidth","fulldive"]}],"lib":[{"key":"DE","name":"Deus Ex 系列","sub":"Ion Storm / Eidos · 2000 / 2011 / 2016","deep":false,"cat":"g","hot":"沉浸式模拟+义体伦理的开山系列。《人类革命》把「增强许可证」「反增强恐袭」做成主线，人机融合议题至今被引用。","profile":"近未来人体增强（机械义肢→纳米义体）引发全球管制与阴谋；主角 Adam Jensen 是少见的「天生适合增强」的人，一身义体自带神经接口。","core":[{"t":"CASIE 神经说服增强（X24）","lv":"L2","d":"实时读取对话对象心理状态并给出说服方案——心理建模级读心尚无路径。"},{"t":"神经义体增强","lv":"L1","d":"义肢与感官由神经接口驱动，现实外骨骼与神经控制假肢已有临床。"}],"scenes":["增强许可证与黑市义体：身体成为行政管辖对象。","「我从未要求这一切」——增强伦理的名台词。","桑德枫丹社会实验：极端身体自由的代价。"],"real":"外骨骼、肌电假肢、视网膜植入全部真实存在；「社交增强」无对应。义体伦理讨论与 2020s 的植入设备审批争议高度同构。","vs":"与 CP2077 同题材但更克制：增强靠手术而非插槽，政治惊悚底色比 2077 的帮派叙事更冷；CASIE 是全表最接近现实的「写入」之一。","ids":["X24"],"cks":["quickhack"]},{"key":"OBS","name":"Observer","sub":"Bloober Team · 2017","deep":false,"cat":"g","hot":"赛博恐怖代表作，卖点只有一个：「潜入死者的大脑取证」。","profile":"2084 年克拉科夫，观察者 Daniel Lazarski 用神经接口潜入濒死者的大脑网络，在对方的主观世界里搜寻线索。","core":[{"t":"神经潜入濒死者大脑","lv":"L3","d":"进入他人主观世界并实时漫游——比解码意图高一个数量级，需全脑双向读与场景重建。"}],"scenes":["增强义眼下的审讯现场。","与濒死对象共享幻觉，分不清记忆属于谁。","大楼里游荡的「数字鬼魂」。"],"real":"濒死脑活动可被 EEG/fMRI 记录，但「进入主观世界」没有任何技术对应物。","vs":"与 CP2077 超梦（C04）同构：都是体验他人的体验；Observer 把它做成了恐怖来源而非消费商品。","ids":[],"cks":["braindance","bandwidth"]},{"key":"SSH","name":"System Shock 系列","sub":"Looking Glass / Nightdive · 1994 / 1999 / 2023 重制","deep":false,"cat":"g","hot":"赛博空间叙事的开山游戏之一，SHODAN 至今是游 // 预计算：esc + 小写只在启动时做一次（原来每次 linkify 调用都要重算 129 次）
const LTX=LT.map(L=>{const t=esc(L.t).toLowerCase();return t?{t:t,h:L.h}:null}).filter(Boolean);
const LINKC=Object.create(null);
function linkify(s){
  const key=String(s);
  const hit=LINKC[key];
  if(hit!==undefined)return hit;
  const out=linkifyRaw(s);
  LINKC[key]=out;
  return out;
}
function linkifyRaw(s){
  const txt=esc(s),low=txt.toLowerCase();
  if(low.length<3)return txt;
  const hits=[];
  for(let n=0;n<LTX.length;n++){
    const L=LTX[n],t=L.t;
    let i=low.indexOf(t);
    while(i!==-1){hits.push([i,i+t.length,L.h]);i=low.indexOf(t,i+t.length);}
  }
  if(!hits.length)return txt;
  hits.sort((a,b)=>a[0]-b[0]||b[1]-a[1]);
  const merged=[];
  hits.forEach(h=>{const last=merged[merged.length-1];if(last&&h[0]<last[1])return;merged.push(h);});
  let out="",p=0;
  merged.forEach(h=>{out+=txt.slice(p,h[0])+'<a class="il" href="'+h[2]+'">'+txt.slice(h[0],h[1])+"</a>";p=h[1];});
  return out+txt.slice(p);
}

// 目录树分组内容放在 <template> 里，展开时才搬进 DOM——首屏可少建约 440 个节点
function fillTree(d){
  const tpl=d.querySelector("template");
  if(tpl){d.appendChild(tpl.content);tpl.remove();}
  markOn();
}
function markOn(seg){
  const href="#/"+(((seg||parseHash().seg).join("/"))||"");
  const rows=document.querySelectorAll("#tree a.row");
  for(let i=0;i<rows.length;i++)rows[i].classList.toggle("on",rows[i].getAttribute("href")===href);
}
function curGroup(seg){
  const t=seg[0],k=seg[1];if(!k)return null;
  if(t==="item"){const d=BY[k];return d?"lv:"+lvKey(d):null;}
  if(t==="case"){const c=CSD[k];return c?"cat:"+c.cat:null;}
  if(t==="compose"){const c=KSD[k];return c?"tier:"+c.tier:null;}
  if(t==="hot"){
    if(DB.hot.some(x=>x.key===k))return null;
    const l=DB.lib.filter(x=>x.key===k)[0];
    return l?"lib:"+l.cat:null;
  }
  return null;
}
function syncTree(seg){
  markOn(seg);
  const g=curGroup(seg);if(!g)return;
  const ds=document.querySelectorAll("#tree details");
  for(let i=0;i<ds.length;i++){
    const d=ds[i];
    if(d.dataset.g===g&&!d.open)d.open=true;
  }
}

function matrixHtml(Ls,Ms,head){

function viewLaw(){

const TBL={q:"",g:"ALL",lv:"ALL",e:"ALL",v:"ALL"};
function hl(s,ts){
  const txt=esc(s);if(!ts.length)return txt;
  const low=txt.toLowerCase(),hits=[];
  ts.forEach(t=>{let i=0;while((i=low.indexOf(t,i))!==-1){hits.push([i,i+t.length]);i+=t.length;}});
  if(!hits.length)return txt;
  hits.sort((a,b)=>a[0]-b[0]||b[1]-a[1]);
  const merged=[];hits.forEach(x=>{const l=merged[merged.length-1];if(l&&x[0]<l[1])return;merged.push(x);});
  let out="",p=0;merged.forEach(x=>{out+=txt.slice(p,x[0])+"<mark>"+txt.slice(x[0],x[1])+"</mark>";p=x[1];});
  return out+txt.slice(p);
}

function drawTable(){
  const ts=TBL.q.trim().toLowerCase().split(" ").filter(x=>x.length>0);
  const li=ts.length===1?LVS.map(l=>l.k.toLowerCase()).indexOf(ts[0]):-1;
  const lvExact=li>=0?LVS[li].k:null;
  const ei=ts.length===1?ETHL.map(l=>l.k.toLowerCase()).indexOf(ts[0]):-1;
  const eExact=ei>=0?ETHL[ei].k:null;
  const vi=ts.length===1?LWL.map(l=>l.k.toLowerCase()).indexOf(ts[0]):-1;
  const vExact=vi>=0?LWL[vi].k:null;
  const list=IT.filter(d=>{
    if(TBL.g!=="ALL"&&d.g!==TBL.g)return false;
    if(TBL.lv!=="ALL"&&lvKey(d)!==TBL.lv)return false;
    if(TBL.e!=="ALL"&&(!d.eth||"E"+d.eth.e!==TBL.e))return false;
    if(TBL.v!=="ALL"&&(!d.law||"V"+d.law.v!==TBL.v))return false;
    if(lvExact)return lvKey(d)===lvExact;
    if(eExact)return d.eth&&"E"+d.eth.e===eExact;
    if(vExact)return d.law&&"V"+d.law.v===vExact;
    if(ts.length){const ethTxt=d.eth?d.eth.n.map(k=>{const x=ETHD[k];return x?x.k+" "+x.name+" "+x.en:"";}).join(" ")+" E"+d.eth.e+" "+(ETHL[d.eth.e]?ETHL[d.eth.e].name:"")+" "+d.eth.why:"";const lawTxt=d.law?d.law.j.map(k=>{const x=LWD[k];return x?x.k+" "+x.name+" "+x.en:"";}).join(" ")+" V"+d.law.v+" "+(LWL[d.law.v]?LWL[d.law.v].name:"")+" "+d.law.why+" "+d.law.basis:"";const hay=[d.id,d.fn,d.work,d.desc,d.basis,d.note,d.flow,d.lvs,GRPN[d.g],ethTxt,lawTxt].join(" ").toLowerCase();if(!ts.every(t=>hay.indexOf(t)!==-1))return false;}
    return true;
  });
  $("#tc").textContent="命中 "+list.length+" / "+IT.length+" 条";
  document.querySelectorAll("#tg button").forEach(b=>b.classList.toggle("on",b.dataset.g===TBL.g));
  document.querySelectorAll("#tl button").forEach(b=>b.classList.toggle("on",b.dataset.l===TBL.lv));
  document.querySelectorAll("#te button").forEach(b=>b.classList.toggle("on",b.dataset.e===TBL.e));
  document.querySelectorAll("#tv button").forEach(b=>b.classList.toggle("on",b.dataset.v===TBL.v));
  const tb=$("#tbody");
  if(!list.length){tb.innerHTML='<tr><td colspan="9" class="empty">没有匹配条目</td></tr>';return;}
  tb.innerHTML=list.map(d=>"<tr><td>"+aItem(d.id,hl(d.id,ts))+"</td><td>"+aItem(d.id,hl(d.fn,ts))+"</td><td>"+hl(d.work,ts)+"</td><td>"+hl(d.flow,ts)+"</td><td>"+pill(d)+"</td><td>"+ethPill(d)+"</td><td>"+lawPill(d)+(d.law&&d.law.v>=3?' <span class="tag" style="color:#d29922;border-color:#d2992255;font-size:10px">未判断</span>':"")+"</td><td>"+hl(d.basis,ts)+"</td><td>"+hl(d.note,ts)+"</td></tr>").join("");
}
function bindTable(){
  const q=$("#tq");if(!q)return;
  // 防抖：连续输入时只在停顿后重建一次 67 行表格
  let tmr=0;
  q.addEventListener("input",e=>{const v=e.target.value;clearTimeout(tmr);tmr=setTimeout(()=>{TBL.q=v;drawTable();},90);});
  q.addEventListener("keydown",e=>{if(e.key==="Escape"){clearTimeout(tmr);e.target.value="";TBL.q="";drawTable();}});
  $("#tg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;TBL.g=b.dataset.g;drawTable();});
  $("#tl").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;TBL.lv=b.dataset.l;drawTable();});
  if($("#te"))$("#te").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;TBL.e=b.dataset.e;drawTable();});
  if($("#tv"))$("#tv").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;TBL.v=b.dataset.v;drawTable();});
  drawTable();
}

function viewAbout(){
  return "<h1>关于本 Wiki</h1><p class=lead>范围、口径与资料说明。</p>"+

  '<div class="card"><h3 style="margin-top:0">法律维度（2026-11-05 新增）</h3><p class="note">每条功能条目另标 <b>法律议题（J1–J8，按受影响的法益／部门法划分）</b>与 <b>法律状态（V0–V4）</b>。<b>本维度只依据 2026-11 现行有效的法律作判断，不预测、不假设任何待议立法。</b>V0 合法 / V1 合规可行 / V2 违法 / V3 无规定 / V4 不进入评价，其中 <b>V3 与 V4 明确「未作判断」</b>，既不算合法也不算违法。依据以中国《刑法》《民法典》《个人信息保护法》《数据安全法》《网络安全法》《医疗器械监督管理条例》《刑事诉讼法》为主，GDPR、EU AI Act、EU MDR、美国 CFAA／BIPA／加州 SB 1223、Oviedo 公约、ICCPR 为参照。详见 <a href="#/law">法律分类标准</a>。</p></div>'+
  '<div class="card"><h3 style="margin-top:0">现实案例对照组（2026-11-05 新增）</h3><p class="note">给全表想象配一列「现实里做到了哪一步」：'+DB.cases.list.length+' 个可核查案例，分八类现实路径（皮层内 / 血管内 / 写入刺激 / 语言解码 / 非侵入 / 监管支付 / 消费灰产 / 失败遗留），每个案例标注 <b>证据等级 E1–E4</b>（监管批准 / 同行评议 / 注册临床 / 厂商宣称）、量化指标，以及最关键的<b>「没做到什么」</b>。纪律是<b>把宣称与证据分开摆放</b>——同一件事经常存在「厂商称已成功」与「公开登记查无试验」两种说法。案例同时反向挂到条目页，可正查与反查。详见 <a href="#/cases">现实案例对照组</a>。</p></div>'+

// ---------- 路由 ----------
function parseHash(){
  const raw=location.hash.replace(/^#\/?/,"");
  const i=raw.indexOf("?"),p=i>=0?raw.slice(0,i):raw,q=i>=0?raw.slice(i+1):"";
  return {seg:p.split("/").filter(Boolean),q:new URLSearchParams(q)};
}
function route(){
  const {seg,q}=parseHash();
  const t=seg[0]||"home";
  let html="",crumb=[["首页","#/"]];
  if(t==="home")html=viewHome();
  else if(t==="scale"){html=viewScale();crumb.push(["结论与难度标尺",""]);}
  else if(t==="ethics"){
    if(seg[1]){const x=ETHD[seg[1]];html=x?viewEthicDim(seg[1]):notFound("伦理议题 "+seg[1]);crumb.push(["伦理标准","#/ethics"],[x?x.k+" "+x.name:"",""]);}
    else{html=viewEthics();crumb.push(["伦理标准",""]);}
  }
  else if(t==="law"){
    if(seg[1]){const x=LWD[seg[1]];html=x?viewLawDim(seg[1]):notFound("法律议题 "+seg[1]);crumb.push(["法律标准","#/law"],[x?x.k+" "+x.name:"",""]);}
    else{html=viewLaw();crumb.push(["法律标准",""]);}
  }
  else if(t==="cases"||t==="case"){
    const ck=seg[1]||(t==="case"?"":null);
    if(ck){const c=CSD[ck];html=c?viewCase(ck):notFound("案例 "+ck);crumb.push(["现实案例","#/cases"],[c?c.k+" "+c.name:"",""]);}
    else{html=viewCases();crumb.push(["现实案例对照组",""]);}
  }
  else if(t==="compose"){
    if(seg[1]){const x=KSD[seg[1]];html=x?viewKit(seg[1]):notFound("科技组合 "+seg[1]);crumb.push(["科技组合","#/compose"],[x?x.k+" "+x.name:"",""]);}
    else{html=viewCompose();crumb.push(["现有科技组合",""]);}
  }
  else if(t==="reality"){html=viewReality();crumb.push(["现实基线",""]);}  else if(t==="about"){html=viewAbout();crumb.push(["关于",""]);}
  else if(t==="item"){const d=BY[seg[1]];html=d?viewItem(d):notFound("条目 "+seg[1]);crumb.push(["功能条目","#/index"],[seg[1]||"",""]);}
  else if(t==="work"){const w=WM[seg[1]];html=w?viewWork(w):notFound("作品 "+seg[1]);crumb.push(["作品",""],[w?w.name:"",""]);}
  else if(t==="hot"){const w=HM[seg[1]];html=w?viewHot(w):notFound("热门作品 "+seg[1]);crumb.push(["热门作品总结",""],[w?w.name:"",""]);}
  else if(t==="concept"){const c=CM[seg[1]];html=c?viewConcept(c):notFound("术语 "+seg[1]);crumb.push(["术语表","#/glossary"],[c?c.term:"",""]);}
  else if(t==="group"){const g=GM[seg[1]];html=g?viewGroup(g):notFound("主题 "+seg[1]);crumb.push(["主题概念",""],[g?g.name:"",""]);}
  else if(t==="glossary"){html=viewGlossary();crumb.push(["术语表",""]);}
  else if(t==="index"){html=viewIndex();crumb.push(["索引与反查",""]);}
  else if(t==="table"){TBL.q=q.get("q")||"";if(q.get("q")){TBL.g="ALL";TBL.lv="ALL";TBL.e="ALL";TBL.v="ALL";}html=viewTable();crumb.push(["完整表格",""]);}
  else if(t==="lv"){const x=LVX[seg[1]];html=viewLevel(seg[1]);crumb.push([x?x.axis+"等级":"等级",x?"#/"+x.ax:""],[x?(x.name.indexOf(x.k)===0?x.name:x.k+" "+x.name):"",""]);}
  else html=notFound("页面 "+t);
  $("#crumb").innerHTML=crumb.map((c,i)=>(i?"<span>/</span>":"")+(c[1]?"<a href=\""+c[1]+"\">"+esc(c[0])+"</a>":"<b>"+esc(c[0])+"</b>")).join("");
  $("#view").innerHTML=html;
  bindTable();
  syncTree(seg);
  $("#side").classList.remove("open");
  window.scrollTo(0,0);
}

// 启动时把各字段拼成小写 haystack 存一次；原来每敲一个键都要重做 300+ 次 join+toLowerCase
const SIDX=(()=>{
  const a=[],add=(t,h,k,f)=>a.push({t:t,h:h,k:k,s:f.join(" ").toLowerCase()});
  IT.forEach(d=>add(d.id+" · "+d.fn,"#/item/"+d.id,"条目",[d.id,d.fn,d.work,d.desc,d.note]));
  DB.works.forEach(w=>add(w.name,"#/work/"+w.key,"作品",[w.name,w.sub,w.intro]));
  DB.hot.concat(DB.lib).forEach(w=>add(w.name,"#/hot/"+w.key,w.deep?"热门":"作品库",[w.name,w.sub,w.hot,w.profile]));
  DB.glossary.forEach(c=>add(c.term,"#/concept/"+c.key,"术语",[c.term,(c.aliases||[]).join(" "),c.def]));
  DB.groups.forEach(g=>add(g.name,"#/group/"+g.key,"主题",[g.name,g.desc]));
  DB.ethics.dims.forEach(x=>add(x.k+" "+x.name,"#/ethics/"+x.k,"伦理",[x.k,x.name,x.en,x.q,x.def,x.real]));
  DB.ethics.levels.forEach(x=>add(x.k+" "+x.name,"#/ethics","等级",[x.k,x.name,x.def]));
  DB.law.dims.forEach(x=>add(x.k+" "+x.name,"#/law/"+x.k,"法律",[x.k,x.name,x.en,x.q,x.def,x.law,x.gap]));
  DB.law.levels.forEach(x=>add(x.k+" "+x.name,"#/law","法律状态",[x.k,x.name,x.def]));
  return a;
})();
const SSTATIC=[["法律分类标准（现行法判断）","#/law","标准"],["伦理道德分类标准","#/ethics","标准"],["结论与难度标尺","#/scale","标准"],["现实基线","#/reality","标准"],["完整表格（可筛选）","#/table","工具"],["索引与反查","#/index","工具"],["术语表","#/glossary","工具"]]
  .map(x=>({t:x[0],h:x[1],k:x[2],s:x[0].toLowerCase()}));
function suggest(q){
  const box=$("#suggest"),k=q.trim().toLowerCase();
  if(!k){box.innerHTML="";box.classList.remove("show");return;}
  const res=[];
  for(let i=SSTATIC.length-1;i>=0;i--){if(SSTATIC[i].s.indexOf(k)!==-1)res.push(SSTATIC[i]);}
  for(let i=0;i<SIDX.length;i++){if(SIDX[i].s.indexOf(k)!==-1)res.push(SIDX[i]);}
  const top=res.slice(0,10);
  box.innerHTML=top.length?top.map(r=>'<a href="'+r.h+'"><span class="k">'+r.k+"</span><span>"+esc(r.t)+"</span></a>").join("")+'<div class="sg-foot">共 '+res.length+' 条 · 回车进入表格视图</div>':'<div class="sg-none">无结果</div>';
  box.classList.add("show");
}
const gq=$("#gq");
gq.addEventListener("input",e=>suggest(e.target.value));
gq.addEventListener("keydown",e=>{
  if(e.key==="Enter"){e.preventDefault();location.hash="#/table?q="+encodeURIComponent(gq.value.trim());$("#suggest").classList.remove("show");gq.blur();}
  if(e.key==="Escape"){gq.value="";$("#suggest").classList.remove("show");gq.blur();}
});
document.addEventListener("click",e=>{if(!e.target.closest(".gsearch"))$("#suggest").classList.remove("show");});
document.addEventListener("keydown",e=>{
  const t=e.target,typing=t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.isContentEditable);
  if(!typing&&e.key==="/"){e.preventDefault();gq.focus();gq.select();}
});
$("#menuBtn").addEventListener("click",()=>$("#side").classList.toggle("open"));
window.addEventListener("hashchange",route);
tree();
route();
</script>
