全部感官输入并接管运动输出。核心不是「接口」，是「替代」。","ids":["M01","M02","M14","M17","M21"]},{"key":"rsi","term":"残余自我影像 RSI","aliases":["RSI","残余自我影像"],"def":"人在 Matrix 里的形象由「自我形象」字段决定，与真实肉体不同。解释了拔除后 Neo 秃头苍白、Matrix 里却有头发。","ids":["M03"]},{"key":"construct","term":"Construct 构造体","aliases":["构造体","Construct"],"def":"空白白色训练空间，可加载技能程序（I know Kung Fu）。现实运动技能靠反复练习，无「写入复杂动作程序」的理论。","ids":["M04","M18","X18"]},{"key":"redpill","term":"红药丸 / 蓝药丸","aliases":["红药丸","蓝药丸"],"def":"其实是两个操作：中断追踪程序并唤醒（易），以及抹掉记忆、植入替代人生（极难）。常被误当成「吃颗药」。","ids":["M07","M13","M06"]},{"key":"cyberbrain","term":"电子脑 Cyberbrain / Ghost","aliases":["电子脑","Cyberbrain","Ghost"],"def":"《攻壳机动队》里大脑直接联网、全身义体化；Ghost 是区别于数据的自我，引出「换完身体我还是我吗」的连续性问题。","ids":["X01","X02","X03","X04"]},{"key":"cortical","term":"皮质栈 / DHF","aliases":["皮质栈","DHF"],"def":"《碳变》里颈后植入存储完整人格，换体如换衣，栈被毁才是「真死」。设定默认「复制＝本人」，比 CP2077 武断。","ids":["X09"]},{"key":"cookie","term":"Cookie 意识副本","aliases":["cookie","Cookie"],"def":"《黑镜》里扫描出有完整主观体验的副本，可被奴役、可被加速承受「百年孤独」——数字人格权利问题的核心设定。","ids":["X10","X11","X14"]},{"key":"fulldive","term":"FullDive 全潜行","aliases":["FullDive","NERvGear"],"def":"《刀剑神域》的非侵入头盔读脑 + 阻断本体感觉 + 全感官写入。最大虚构点：无创设备达到侵入式全带宽。","ids":["X16","X15"]},{"key":"wbe","term":"全脑仿真 / 意识上传","aliases":["全脑仿真","意识上传","WBE"],"def":"按突触级扫描并模拟全脑。2025 年《State of Brain Emulation Report》定为 TRL 1–2、至少 30–40 年；另有基底依赖与副本问题。","ids":["C09","M12","X12","X13","X14"]},{"key":"bandwidth","term":"带宽瓶颈","aliases":["带宽瓶颈","带宽"],"def":"语音约 39 bit/s；顶尖植入 1024 电极对约 860 亿神经元。这是所有「全沉浸」想象最硬的一堵墙。","ids":["C04","M01","M02","X16","X25"]},{"key":"bidirectional","term":"双向 BCI / 写入","aliases":["双向 BCI","全双工"],"def":"现实人体植入目前以只读为主，刺激（写入）刚进小规模试验，且不知道往哪儿写。虚构几乎都假设全双工随意写。","ids":["C02","C06","M04","X19","X23"]},{"key":"copy","term":"副本问题 / 主体连续性","aliases":["副本问题","延续性谬误","主体连续性"],"def":"复制一个行为完全相同但无主观体验的东西，算不算让你活下去？CP2077 与《SOMA》回答「不算」，《碳变》《万神殿》默认「算」。","ids":["C10","C13","M11","M12","X09","X10","X12","X13"]},{"key":"substrate","term":"基底依赖","aliases":["基底依赖","基底"],"def":"意识是否只能由生物组织产生。若成立，数字上传只会得到功能模仿品而非 廉·吉布森 1984 · 尼尔·斯蒂芬森 1992","intro":"赛博朋克的源头文本。Simstim 是超梦的祖型，Dixie Flatline 几乎就是 CP2077 的 engram；黑冰 ICE 被桌游 2020 直接继承。","list":["《神经漫游者》Neuromancer (1984)","《雪崩》Snow Crash (1992)"],"ids":["X05","X06","X07","X08"]},{"key":"Carbon","name":"碳变 / 副本","sub":"Richard Morgan 小说 · Netflix S1","intro":"设定默认「复制＝本人」，栈即身份。是 C10（CP2077 否定复制＝复活）最干净的反例。","list":["《副本》Altered Carbon 小说","Netflix《碳变》第一季"],"ids":["X09"]},{"key":"BlackMirror","name":"黑镜 / 上载新生","sub":"White Christmas · San Junipero · USS Callister · Playtest","intro":"把技术难题包装成消费与权利问题：cookie 被奴役、数字来世按带宽收费、神经植入式恐怖游戏。伦理上最锋利的一组。","list":["《黑镜》White Christmas","《黑镜》San Junipero / USS Callister / Playtest","《上载新生》Upload"],"ids":["X10","X11","X19"]},{"key":"SOMA","name":"SOMA / 万神殿 / 西部世界","sub":"Frictional Games 2015 · 2022 动画 · HBO","intro":"《SOMA》对「复制≠转移」讨论最彻底；万神殿默认 UI 就是本人，两者立场相反。《西部世界》难得地把「保真度验证」写进了设定。","list":["《SOMA》(2015) 游戏","《万神殿》Pantheon 动画","《西部世界》Westworld"],"ids":["X12","X13","X14"]},{"key":"SAO","name":"刀剑神域 / 心理测量者","sub":"Alicization · 西比拉系统","intro":"一个是非侵入 FullDive 却要求侵入级带宽；一个把活体大脑并联成群体裁决计算机，是脑联网最极端的想象。","list":["《刀剑神域》SAO / Alicization","《心理测量者》PSYCHO-PASS"],"ids":["X15","X16","X17"]},{"key":"Games","name":"Prey / Deus Ex / ID: INVADED","sub":"神经模块 · 社交增强 · 读脑场景化","intro":"游戏与动画里把「写入」做得最可操作的三例：可安装/卸载的技能模块、用于说服的神经读数、把读心换成读场景以绕开编解码难题。","list":["《Prey》(2017)","《Deus Ex: Human Revolution》(2011)","《ID: INVADED》"],"ids":["X18","X22","X24"]},{"key":"Films","name":"盗梦空间 / 源代码 / 阿凡达 / 头号玩家","sub":"共享梦境 · 记忆残响 · 远程替身 · 非侵入对照","intro":"《头号玩家》是重要对照组：不碰脑也能做到相当沉浸，反过来削弱了「必须绕过感官器官直达大脑」这个想象惯性。","list":["《盗梦空间》Inception","《源代码》Source Code","《阿凡达》Avatar","《头号玩家》Ready Player One"],"ids":["X20","X21","X23","X25"]}],"hot":[{"key":"GITS","name":"攻壳机动队","sub":"士郎正宗漫画 1989– · 押井守剧场版 1995 · S.A.C. 2002–2005 · 2017 真人版","deep":true,"cat":"","hot":"赛博朋克动画的公认坐标。押井守 1995 剧场版把「Ghost / 躯壳」之问推入主流；S.A.C. 的笑脸男单元至今仍是「网络时代公众事件如何被制造」的最佳教科书，新作与联动持续在产出。","profile":"舞台是 2030 年前后的日本：大脑可以直接联网（电子脑），身体可以整具替换（义体），只剩脑壳里那颗原装大脑还算「自己」。公安九课的少校素子就是这条路线走到底的人，全剧都在问：换到最后，Ghost 还在不在。它是《黑客帝国》沃卓斯基公开承认的直接灵感来源。","core":[{"t":"电子脑 Cyberbrain（X01）","lv":"L4","d":"大脑直连网络，颅骨外壳即防火墙。现实无线植入带宽只够打字级，且无人敢把大脑这样暴露在网络上。"},{"t":"电子脑入侵 / 笑脸男（X02）","lv":"L3","d":"通过视觉通道实时劫持他人感知，让目击者「看不见」关键人物。视觉皮层刺激在现实有雏形，但这种实时全人群劫持是 L3。"},{"t":"Stand Alone Complex（X03）","lv":"L5","d":"没有原版的模仿犯在网络上自发涌现——网络化大脑带来的社会级副作用想象，属世界观规则而非技术。"},{"t":"素子 × 傀儡师融合（X04）","lv":"L5","d":"两个数字/生物心智合为一体并各自存续，直接跳过副本问题给出浪漫解，科学上无从讨论。"}],"scenes":["全身义体化：肉体能换的都换了，剧情仍把「大脑原装」当作人格最后的锚。","Ghost 异常检测：义体医生反复确认「这孩子有没有 Ghost」——作品明说 Ghost 无法用任何仪器验证，这正是它的论点。","笑脸男事件：一个黑客同时劫持所有在场者的电子脑视觉，制造「完美犯罪」与全社会模仿犯。","塔奇克马：AI 战车比人类更有人味，反向追问「人格到底是什么」。"],"real":"电子脑等于把大脑直接变成联网终端。现实里侵入式植入需开颅、带宽只够光标与打字、信号数月就衰减；「同时劫持一群人的视觉」需要每人都有高带宽视觉写入通道——差着好几个范式级突破。","vs":"《黑客帝国》(1999) 的颈后接口、绿色代码雨与「意识进入网络空间」的视觉语言直接承自 1995 攻壳。攻壳的 Ghost 立场与 CP2077「engram 无主体意识」同属「自我不可复制」阵营：素子最后选择与傀儡师融合而非被复制，就是 refusal 的浪漫版。","ids":["X01","X02","X03","X04"],"cks":["cyberbrain","copy"]},{"key":"SAO","name":"刀剑神域","sub":"川原砾小说 2009– · A-1 Pictures 动画 2012– · Alicization 2018–","deep":true,"cat":"","hot":"FullDive 想象在中文圈最有名的载体。SAO 篇定义了一代人对「完全潜行游戏」的想象，Alicization 篇则把意识复制、灵魂翻译推到 L5 深水区。","profile":"NerveGear 头盔阻断本体感觉、向神经系统写入全感官信号，玩家意识整体进入虚拟世界。Alicization 篇换成 Soul Translator：用高密度扫描把「摇光」（灵魂架构）翻译出来，甚至能复制出一个有主观体验的人。","core":[{"t":"FullDive 全潜行（X16）","lv":"L3","d":"非侵入头盔实现全感官读写。最大虚构点：无创设备达到侵入式全带宽——颅骨外的信号信噪比差着数量级。"},{"t":"摇光 / STL 灵魂翻译（X15）","lv":"L5","d":"把灵魂当作可翻译、可复制的数据结构。属范式之外的世界观规则，但它是「意识＝信息」立场的极端化演示。"}],"scenes":["死亡游戏：摘头盔即被微波烧毁大脑——用肉体死亡锁死「退出」这个安全阀。","GGO 篇意识转移：意识瞬间迁移到另一台设备，跳过物理传输的想象。","Under World：摇光在其中经历 200 年主观时间，出来说明「模拟中的时间加速」会直接压垮心智。","爱丽丝·滋贝鲁库：复制出的摇光带着完整人格与记忆被带走，本体仍在 Under World——作品明确把它当「绑架」处理。"],"real":"现实非侵入路线（EEG/fNIRS/经颅刺激）带宽与定位精度都只够简单指令；阻断本体感觉与全感官写入均无从谈起。「复制出的意识算不算人」目前没有任何判据，作品替观众做了情感裁决。","vs":"对照《黑客帝国》：Matrix 选侵入插孔，SAO 选非侵入头显——SAO 的路径用户更省事，物理上却更不可能。对照 CP2077：超梦是「录像回放」，FullDive 是「现场直播自己」，前者 L3 后者也是 L3，但 SAO 的摇光复制直接撞上 L5。","ids":["X15","X16"],"cks":["fulldive","bandwidth","copy"]},{"key":"BlackMirror","name":"黑镜","sub":"Channel 4 → Netflix 选集剧 2011– · White Christmas / San Junipero / USS Callister / Playtest 等","deep":true,"cat":"","hot":"把「数字人格」拍成消费与法律问题的选集剧，热度长年不减。它不关心 BCI 硬件，只关心一件事：如果副本有你全部的主观体验，你对它负什么责任。","profile":"每集独立。与脑机相关的三集构成一条完整链条：White Christmas 造出可被奴役的意识副本，San Junipero 问数字来世归谁所有，Playtest 把神经植入变成商业恐怖游戏。","core":[{"t":"Cookie 意识副本被奴役（X10）","lv":"L4","d":"扫描出有完整主观体验的副本，可被加速、可被拷问。「数字人格权利」问题的核心设定。"},{"t":"数字来世付费分层（X11）","lv":"L4","d":"云端永生按订阅收费，穷人有穷人的服务器。把上传的市场化后果演成正文。"},{"t":"神经植入式恐怖游戏（X19）","lv":"L3","d":"植入体读取恐惧信号并实时生成恐怖场景——读出 + 生成闭环，L3 且是全剧最接近现实游戏技术的一集。"}],"scenes":["White Christmas：把副本的主观时间调到 1000 年/分钟用来逼供——「加速主观时间」是全系列最狠的想象。","San Junipero：死后意识上传进度假小镇，每周限时体验。","Playtest：现实恐惧被读取后放大回灌，玩家被自己的神经信号吓死。"],"real":"Cookie 需要无创获取完整主观体验——现有任何扫描手段都远达不到；「主观时间加速」没有神经科学机制。真正已现雏形的是 Playtest 一类：用生理信号驱动自适应恐怖游戏，无需 BCI 用心率/皮电也能做。","vs":"CP2077 把「数字人格权利」放在文案与支线里，黑镜直接把它拍成正剧并推到法律场景。《黑客帝国》问机器为何造 Matrix，黑镜只问人如何对待数字人——社会性最强，技术设定最含糊。","ids":["X10","X11","X19"],"cks":["cookie","copy","substrate"]},{"key":"Pantheon","name":"万神殿","sub":"动画 2022–2023 · 改编自刘宇昆《The Perfect Match》等短篇","deep":true,"cat":"","hot":"近年把「意识上传」讲得最完整的动画：不只问能不能，还把上传后的劳动力市场、公司所有权、AI 战争全部推演了一遍，2023 年完结后讨论度持续走高。","profile":"渐冻症工程师 David Kim 被公司秘密全脑扫描，成为上传智能 UI。公司随后把 UI 当算力资产：雇去跑金融模型、设计产品、充当武器。故事的核心冲突不是技术，是所有权——公司认为买断了那个「人」。","core":[{"t":"上传智能 UI / 渐冻（X13）","lv":"L4","d":"突触级全脑扫描＋模拟。默认「复制＝本人」，与 CP2077 立场正相反。"}],"scenes":["UI 被公司雇去做高频交易与设计——「意识」第一次被当作纯算力资产定价。","感知瓶颈：UI 没有身体，需要喂入海量感官流才不疯，反证了「意识离不开心身耦合」。","UI 之间的战争与联盟：数字人格的世界同样长出政治。"],"real":"2025 年《State of Brain Emulation Report》把全脑仿真定为 TRL 1–2、至少 30–40 年：目前只完成果蝇连接组，人脑约 860 亿神经元 / 约 100 万亿突触。「扫描的人还是本人」无任何实证判据。","vs":"与《碳变》同属「复制＝本人」阵营，与 CP2077 / SOMA 正面相撞——同一个技术动作，两种哲学答案。它独有的是把 CP2077 只在背景里暗示的「荒坂靠 engram 盈利」拍成了主线：上传的第一个应用是剥削。","ids":["X13"],"cks":["wbe","copy","substrate"]},{"key":"Carbon","name":"碳变 / 副本","sub":"Richard Morgan 小说 2002 · Netflix 剧集 2018–","deep":true,"cat":"","hot":"「换体如换衣」设定的代表作，Netflix 化后热度破圈。它把意识上传的伦理问题用最粗暴的方式砍掉了：栈即身份，复制即本人，没什么好争的。","profile":"人的意识存在颈椎后的皮质栈里，死后栈可保存数百年，随时压入新义体（Sleeve）。穷人租尸体，富人养「备份义体仓库」，被抓前自动远程备份——永生按财富分层。","core":[{"t":"皮质栈 + DHF + 换体（X09）","lv":"L4","d":"完整人格数字化存储、跨躯体传输、无损写入新脑。写入端（往生物脑里写一个人格）没有任何理论路径。"}],"scenes":["双份意识审讯：把同一个人的栈装进两个义体同时审讯，事后合并——官方承认副本也是「他」。","「真死」定义：只有栈被物理摧毁才算死。","义体妓院与器官市场：意识可迁移后，身体沦为可更换硬件的社会学推演。"],"real":"DHF（数字人传）要把约 100 万亿突触状态压进指甲盖芯片，再无损写入另一个发育完成的人脑——两步都无理论。栈本身倒有个低配现实对应物：脊髓刺激电极确实放在颈椎附近，但那只是刺激运动通路，不存任何东西。","vs":"与 CP2077 的 Relic 是最直接的一对：同为「芯片承载人格」，Relic 至少承认覆写宿主的是会劣化的 engram 空壳；碳变则干脆默认复制＝本人，设定比 CP2077 武断。它还是 X10（CP2077 否定复制＝复活）最干净的反例。","ids":["X09"],"cks":["cortical","copy","substrate"]},{"key":"SOMA","name":"SOMA","sub":"Frictional Games · 2015 · 恐怖游戏","deep":true,"cat":"","hot":"把「复制≠转移」演得最疼的作品，常年被列为意识上传话题的必玩/必读。别的作品讨论副本问题，SOMA 让你亲身体验两次——每次都以玩家的视角醒来，发现「我」没走成。","profile":"海底站 WAU 用认知结构复制维持「人类」存续：扫描你的大脑，把副本装进仿生躯壳，本体原地被抛下。玩家角色 Simon 每次扫描都以为自己会「过去」，醒来却发现醒来的永远是副本，本体留在黑暗里。","core":[{"t":"脑扫描 → 仿生躯壳 / 延续性谬误（X12）","lv":"L4","d":"扫描即复制，复制即另起一个主体。作品不设彩蛋，把延续性谬误做成核心玩法与恐怖感来源。"}],"scenes":["第一次复制：Simon 醒来在 2104 年的深海底站，80 年过去了——「转移」从未发生，只是有人替他继续活着。","发射方舟：把几十个复制心智送上天，留在地上的人目送——一次集体性的延续性处刑。","Catherine 的头：只剩数字大脑的同伴，两人的每次对话都在演示「基底不同，体验不同」。"],"real":"现实所有「上传」方案本质上都是复制；「转移」没有技术路径，甚至没有可操作定义——什么算「同一个人」搬过去了，哲学上无判据。SOMA 的诚实之处在于不假装有。","vs":"比 CP2077 更彻底：V 和 Johnny 还能在同一颗脑子里对话，SOMA 里每次复制都是一次哲学处刑，无人幸免。与《黑客帝国》构成两极：Matrix 用「你以为的真实」骗肉体，SOMA 用「你以为的转移」骗灵魂。","ids":["X12"],"cks":["wbe","copy","substrate"]},{"key":"Neuromancer","name":"神经漫游者 / 雪崩","sub":"威廉·吉布森 1984 · 尼尔·斯蒂芬森 1992","deep":true,"cat":"","hot":"赛博朋克的源头文本：cyberspace、ICE、Simstim 这些词全从这来，CP2077 与黑客帝国的设定家谱都能追溯到它。2026 年前后影视化消息不断，讨论度回潮。","profile":"《神经漫游者》：过气黑客凯斯带着「死去」搭档的 ROM 人格、为神秘雇主攻破巨型企业 AI。《雪崩》：提出 Metaverse 与「语言即病毒」——把虚拟空间和 MEME 攻击两个概念提前了三十年。","core":[{"t":"Simstim 模拟刺激（X05）","lv":"L3","d":"以他人视角直播感官体验——超梦 Braindance 的直系祖型。"},{"t":"Dixie Flatline（X06）","lv":"L4","d":"死去的黑客被存成 ROM 芯片，只保留人格行为模式、无意识——几乎就是 CP2077 的 engram，而且同样承认「里面没有人」。"},{"t":"黑冰 ICE / 缆线直连（X07）","lv":"L2","d":"入侵防御系统与神经接驳。桌游 Cyberpunk 2020 直接继承 ICE 与缆线设定，传到 CP2077。"},{"t":"Metaverse + Snow Crash 病毒（X08）","lv":"L5","d":"街道级虚拟空间＋通过语言/图像黑进人脑的病毒——后者是纯世界观规则。"}],"scenes":["凯斯的「舱体」：泡在营养液里接缆线冲网络——CP2077 网络行者与黑客帝国培养舱共同的视觉祖先。","Dixie 芯片：「我死了，别再叫我醒来」——虚构作品第一次认真写「ROM 里的人格算不算活着」。","Straylight 决战：两个 AI（Wintermute / Neuromancer）欲合为一体，比攻壳傀儡师早十年。","Metaverse 的 The Street：头号玩家 OASIS 与一切元宇宙产品的祖型。"],"real":"缆线直连反而在 2026 年比无线更「严谨」：有线物理隔离是现实安全基线（air-gap），桌游时代要插线、游戏时代无线的演进正好和安全趋势相反。ICE→黑冰→Blackwall 是一条被完整继承的设定链。","vs":"CP2077 的 engram ≈ Dixie Flatline，Mikoshi 囚禁 engram 的设定 ≈ Neuromancer 囚禁人格的虚拟囚笼（认出这点的人很多，但 Straylight 本来就是「ROM 狱」的放大版）。黑客帝国的训练构造体与吉布森的 cyberspace 一脉相承。","ids":["X05","X06","X07","X08"],"cks":["braindance","bandwidth","quickhack"]},{"key":"Westworld","name":"西部世界","sub":"HBO 2016–2022 · 四季","deep":true,"cat":"","hot":"把「人造意识」从制造拍到解放再到扩散的剧集，第四季干脆让人类自己住进他人编好的剧本——热度争议都大，但「保真度测试」这一段设定在全表里独一份。","profile":"host 的意识存在「心智核心」里，可复制、可备份、可重置。人类用它造主题公园；剧情后半，host 的心智被装进人类身体，复制体与本体并存，验证「副本是不是他」成了剧情本身。","core":[{"t":"host 心智核心 / 保真度测试（X14）","lv":"L4","d":"全表唯一把「复制品还是不是他」工程化的作品：用重复访谈逐句比对回答，误差收敛即视为保真。"}],"scenes":["伯纳德复制德洛丽丝心智：逐条访谈校准，「你听到的声音是最真实的吗」——把哲学问题做成了 QA 流程。","心智球：意识可以攥在手里的物理形态。","第四季：人类城市本身就是一座更大的西部世界——控制权反转。"],"real":"保真度测试是个真问题：现实如果有了人格副本，验证「像不像」只能靠行为比对，西部世界给出的恰是目前唯一可操作的方法——尽管它无法回答主观体验是否被复制。心智球则是纯叙事：现有存储密度差十几个数量级。","vs":"与 CP2077 的 Mikoshi 同为「数字监狱」，但西部世界写了验证与校准协议，Mikoshi 只写了关押。与《黑客帝国》Resurrections 的「循环重启世界」互为镜像：一边是 host 重写人类剧本，一边是机器重写人类历史。","ids":["X14"],"cks":["copy","wbe"]},{"key":"Inception","name":"盗梦空间","sub":"克里斯托弗·诺兰 · 2010","deep":true,"cat":"","hot":"「写入」主题的国民级作品：不改硬件、不打插孔，全靠叙事把「往人脑里植入一个想法」讲成了影史经典。多层梦境与时间膨胀的设定被讨论了十几年。","profile":"团队通过镇静剂共享梦境，在梦中偷取机密（extraction）或反过来植入想法（inception）。植入必须让目标觉得想法是自发产生的——这是全片对「写入」最准确的直觉：硬塞的会被抗拒，长出来的才稳定。","core":[{"t":"共享梦境 / 植入意念（X20）","lv":"L4","d":"多人进入同一层梦境并修改其中人的认知。「精准植入复杂意念且不自知」没有任何现实路径。"}],"scenes":["三层梦境＋limbo：镇静越深，层数越深，主观时间越长。","时间膨胀：每深一层约 ×20——现实梦境时间感知最多拉长约 20–100%，方向对但量级是叙事需要。","图腾与「你的大脑把它当成真实」：与《黑客帝国》「什么是真实」是同一个问题。"],"real":"现实最近的两块碎片：定向记忆激活（TMR，睡眠中重放线索以加固/影响特定记忆）与清醒梦诱导——都只能「推一把」，不能「装进去」一个完整想法。共享梦境则完全虚构：梦境无法从外部调度成同一剧本。","vs":"它把《黑客帝国》「大脑把模拟当成真实」的设定反向使用：Matrix 骗你一生，盗梦空间骗你一层。与 CP2077 的写入系条目（技能芯片 C16、Relic 覆写 C11）同属 M→B 流向，但诺兰明确选了「软写入」——通过经验与暗示完成，反而绕开了编解码难题。","ids":["X20"],"cks":["bidirectional"]},{"key":"RPO","name":"头号玩家","sub":"史蒂文·斯皮尔伯格 · 2018 · 原著 Ernest Cline 2011","deep":true,"cat":"","hot":"全球票房 6 亿美元的虚拟世界大片，也是本表最重要的对照组：它证明了不碰大脑也能做成十亿人平台——直接给「必须 BCI 才能全沉浸」的想象惯性降了温。","profile":"2045 年，人类在 OASIS（纯外设 VR：头显、触觉手套、全向跑步机）里工作、社交、上学、打金币。没有一根线插进任何人的脑子。","core":[{"t":"OASIS（对照组，X25）","lv":"L1","d":"全表唯一的 L1 大型想象：消费级 VR + 触觉外设，现实正在追赶，且已部分实现。"}],"scenes":["触觉手套：手指动作与触感反馈——现实已有力反馈手套原型。","全向跑步机＋动捕套装：身体仍是控制器，感官仍是输入端。","绿洲键与商业闭环：虚拟世界的经济绑定现实身份——元宇宙构想的完整预告片。"],"real":"这是全表里唯一一条「现实跑在虚构前面」的线：消费级头显、6DoF 追踪、力反馈手套、社交 VR 全部存在。它的沉浸上限由感官器官决定——分辨率、视场角、触觉保真度都是外设工程问题，所以才是 L1。","vs":"对两部重点作品都是反衬：《黑客帝国》的插孔路线假设「绕过感官器官直达神经」才有真沉浸，OASIS 证明感官层就能卖票，只是上限低；《SAO》的 FullDive 是它的 L3 升级幻想。如果未来真建成十亿人的「Matrix 式」平台，工程上更可能是 OASIS 形态，而不是给每人开颅。","ids":["X25"],"cks":["bandwidth","fulldive"]}],"lib":[{"key":"DE","name":"Deus Ex 系列","sub":"Ion Storm / Eidos · 2000 / 2011 / 2016","deep":false,"cat":"g","hot":"沉浸式模拟+义体伦理的开山系列。《人类革命》把「增强许可证」「反增强恐袭」做成主线，人机融合议题至今被引用。","profile":"近未来人体增强（机械义肢→纳米义体）引发全球管制与阴谋；主角 Adam Jensen 是少见的「天生适合增强」的人，一身义体自带神经接口。","core":[{"t":"CASIE 神经说服增强（X24）","lv":"L2","d":"实时读取对话对象心理状态并给出说服方案——心理建模级读心尚无路径。"},{"t":"神经义体增强","lv":"L1","d":"义肢与感官由神经接口驱动，现实外骨骼与神经控制假肢已有临床。"}],"scenes":["增强许可证与黑市义体：身体成为行政管辖对象。","「我从未要求这一切」——增强伦理的名台词。","桑德枫丹社会实验：极端身体自由的代价。"],"real":"外骨骼、肌电假肢、视网膜植入全部真实存在；「社交增强」无对应。义体伦理讨论与 2020s 的植入设备审批争议高度同构。","vs":"与 CP2077 同题材但更克制：增强靠手术而非插槽，政治惊悚底色比 2077 的帮派叙事更冷；CASIE 是全表最接近现实的「写入」之一。","ids":["X24"],"cks":["quickhack"]},{"key":"OBS","name":"Observer","sub":"Bloober Team · 2017","deep":false,"cat":"g","hot":"赛博恐怖代表作，卖点只有一个：「潜入死者的大脑取证」。","profile":"2084 年克拉科夫，观察者 Daniel Lazarski 用神经接口潜入濒死者的大脑网络，在对方的主观世界里搜寻线索。","core":[{"t":"神经潜入濒死者大脑","lv":"L3","d":"进入他人主观世界并实时漫游——比解码意图高一个数量级，需全脑双向读与场景重建。"}],"scenes":["增强义眼下的审讯现场。","与濒死对象共享幻觉，分不清记忆属于谁。","大楼里游荡的「数字鬼魂」。"],"real":"濒死脑活动可被 EEG/fMRI 记录，但「进入主观世界」没有任何技术对应物。","vs":"与 CP2077 超梦（C04 function linkify(s){
  const txt=esc(s),low=txt.toLowerCase(),hits=[];
  LT.forEach(L=>{
    const t=esc(L.t).toLowerCase();if(!t)return;
    let i=0;while((i=low.indexOf(t,i))!==-1){hits.push([i,i+t.length,L.h]);i+=t.length;}
  });
  if(!hits.length)return txt;
  hits.sort((a,b)=>a[0]-b[0]||b[1]-a[1]);
  const merged=[];
  hits.forEach(h=>{const last=merged[merged.length-1];if(last&&h[0]<last[1])return;merged.push(h);});
  let out="",p=0;
  merged.forEach(h=>{out+=txt.slice(p,h[0])+'<a class="il" href="'+h[2]+'">'+txt.slice(h[0],h[1])+"</a>";p=h[1];});
  return out+txt.slice(p);
}

const TBL={q:"",g:"ALL",lv:"ALL"};
function hl(s,ts){
  const txt=esc(s);if(!ts.length)return txt;
  const low=txt.toLowerCase(),hits=[];
  ts.forEach(t=>{let i=0;while((i=low.indexOf(t,i))!==-1){hits.push([i,i+t.length]);i+=t.length;}});
  if(!hits.length)return txt;
  hits.sort((a,b)=>a[0]-b[0]||b[1]-a[1]);
  const merged=[];hits.forEach(x=>{const l=merged[merged.length-1];if(l&&x[0]<l[1])return;merged.push(x);});
  let out="",p=0;merged.forEach(x=>{out+=txt.slice(p,x[0])+"<mark>"+txt.slice(x[0],x[1])+"</mark>";p=x[1];});
  return out+txt.slice(p);
}
function viewTable(){
  return '<h1>完整表格</h1><p class="lead">保留原表格视图的搜索与筛选。空格分隔多关键词（AND）；单独输入 L1–L5 视为难度精确筛选。</p>'+
  '<div class="controls"><input type="search" id="tq" placeholder="搜索功能 / 作品 / 设定 / 注释 / 编号…" value="'+esc(TBL.q)+'">'+
  '<div class="seg" id="tg"><button data-g="ALL">全部作品</button><button data-g="CP">赛博朋克 2077</button><button data-g="M">黑客帝国</button><button data-g="X">其他作品</button></div>'+
  '<div class="seg" id="tl"><button data-l="ALL">全部难度</button>'+LVS.map(l=>'<button data-l="'+l.k+'">'+l.k+"</button>").join("")+"</div>"+
  '<span class="count" id="tc"></span></div>'+
  '<div style="overflow-x:auto;border:1px solid var(--line);border-radius:9px"><table class="w" style="min-width:900px"><thead><tr><th>#</th><th>功能</th><th>出处</th><th>流向</th><th>难度</th><th>实现依据 / 瓶颈</th><th>注释</th></tr></thead><tbody id="tbody"></tbody></table></div>';
}
function drawTable(){
  const ts=TBL.q.trim().toLowerCase().split(" ").filter(x=>x.length>0);
  const li=ts.length===1?LVS.map(l=>l.k.toLowerCase()).indexOf(ts[0]):-1;
  const lvExact=li>=0?LVS[li].k:null;
  const list=IT.filter(d=>{
    if(TBL.g!=="ALL"&&d.g!==TBL.g)return false;
    if(TBL.lv!=="ALL"&&lvKey(d)!==TBL.lv)return false;
    if(lvExact)return lvKey(d)===lvExact;
    if(ts.length){const hay=[d.id,d.fn,d.work,d.desc,d.basis,d.note,d.flow,d.lvs,GRPN[d.g]].join(" ").toLowerCase();if(!ts.every(t=>hay.indexOf(t)!==-1))return false;}
    return true;
  });
  $("#tc").textContent="命中 "+list.length+" / "+IT.length+" 条";
  document.querySelectorAll("#tg button").forEach(b=>b.classList.toggle("on",b.dataset.g===TBL.g));
  document.querySelectorAll("#tl button").forEach(b=>b.classList.toggle("on",b.dataset.l===TBL.lv));
  const tb=$("#tbody");
  if(!list.length){tb.innerHTML='<tr><td colspan="7" class="empty">没有匹配条目</td></tr>';return;}
  tb.innerHTML=list.map(d=>"<tr><td>"+aItem(d.id,hl(d.id,ts))+"</td><td>"+aItem(d.id,hl(d.fn,ts))+"</td><td>"+hl(d.work,ts)+"</td><td>"+hl(d.flow,ts)+"</td><td>"+pill(d)+"</td><td>"+hl(d.basis,ts)+"</td><td>"+hl(d.note,ts)+"</td></tr>").join("");
}
function bindTable(){
  const q=$("#tq");if(!q)return;
  q.addEventListener("input",e=>{TBL.q=e.target.value;drawTable();});
  q.addEventListener("keydown",e=>{if(e.key==="Escape"){e.target.value="";TBL.q="";drawTable();}});
  $("#tg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;TBL.g=b.dataset.g;drawTable();});
  $("#tl").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;TBL.lv=b.dataset.l;drawTable();});
  drawTable();
}

// ---------- 路由 ----------
function parseHash(){
  const raw=location.hash.replace(/^#\/?/,"");
  const i=raw.indexOf("?"),p=i>=0?raw.slice(0,i):raw,q=i>=0?raw.slice(i+1):"";
  return {seg:p.split("/").filter(Boolean),q:new URLSearchParams(q)};
}
function route(){
  const {seg,q}=parseHash();
  const t=seg[0]||"home";
  let html="",crumb=[["首页","#/"]];
  if(t==="home")html=viewHome();
  else if(t==="scale"){html=viewScale();crumb.push(["结论与难度标尺",""]);}
  else if(t==="reality"){html=viewReality();crumb.push(["现实基线",""]);}
  else if(t==="about"){html=viewAbout();crumb.push(["关于",""]);}
  else if(t==="item"){const d=BY[seg[1]];html=d?viewItem(d):notFound("条目 "+seg[1]);crumb.push(["功能条目","#/index"],[seg[1]||"",""]);}
  else if(t==="work"){const w=WM[seg[1]];html=w?viewWork(w):notFound("作品 "+seg[1]);crumb.push(["作品",""],[w?w.name:"",""]);}
  else if(t==="hot"){const w=HM[seg[1]];html=w?viewHot(w):notFound("热门作品 "+seg[1]);crumb.push(["热门作品总结",""],[w?w.name:"",""]);}
  else if(t==="concept"){const c=CM[seg[1]];html=c?viewConcept(c):notFound("术语 "+seg[1]);crumb.push(["术语表","#/glossary"],[c?c.term:"",""]);}
  else if(t==="group"){const g=GM[seg[1]];html=g?viewGroup(g):notFound("主题 "+seg[1]);crumb.push(["主题概念",""],[g?g.name:"",""]);}
  else if(t==="glossary"){html=viewGlossary();crumb.push(["术语表",""]);}
  else if(t==="index"){html=viewIndex();crumb.push(["索引与反查",""]);}
  else if(t==="table"){TBL.q=q.get("q")||"";html=viewTable();crumb.push(["完整表格",""]);}
  else html=notFound("页面 "+t);
  $("#crumb").innerHTML=crumb.map((c,i)=>(i?"<span>/</span>":"")+(c[1]?"<a href=\""+c[1]+"\">"+esc(c[0])+"</a>":"<b>"+esc(c[0])+"</b>")).join("");
  $("#view").innerHTML=html;
  bindTable();
  syncTree(seg);
  $("#side").classList.remove("open");
  window.scrollTo(0,0);
}

// ---------- 全局搜索 ----------
function suggest(q){
  const box=$("#suggest"),k=q.trim().toLowerCase();
  if(!k){box.innerHTML="";box.classList.remove("show");return;}
  const res=[];
  IT.forEach(d=>{if([d.id,d.fn,d.work,d.desc,d.note].join(" ").toLowerCase().indexOf(k)!==-1)res.push({t:d.id+" · "+d.fn,h:"#/item/"+d.id,k:"条目"});});
  DB.works.forEach(w=>{if([w.name,w.sub,w.intro].join(" ").toLowerCase().indexOf(k)!==-1)res.push({t:w.name,h:"#/work/"+w.key,k:"作品"});});
  DB.hot.concat(DB.lib).forEach(w=>{if([w.name,w.sub,w.hot,w.profile].join(" ").toLowerCase().indexOf(k)!==-1)res.push({t:w.name,h:"#/hot/"+w.key,k:w.deep?"热门":"作品库"});});
  DB.glossary.forEach(c=>{if([c.term,(c.aliases||[]).join(" "),c.def].join(" ").toLowerCase().indexOf(k)!==-1)res.push({t:c.term,h:"#/concept/"+c.key,k:"术语"});});
  DB.groups.forEach(g=>{if([g.name,g.desc].join(" ").toLowerCase().indexOf(k)!==-1)res.push({t:g.name,h:"#/group/"+g.key,k:"主题"});});
  const top=res.slice(0,10);
  box.innerHTML=top.length?top.map(r=>'<a href="'+r.h+'"><span class="k">'+r.k+"</span><span>"+esc(r.t)+"</span></a>").join("")+'<div class="sg-foot">共 '+res.length+' 条 · 回车进入表格视图</div>':'<div class="sg-none">无结果</div>';
  box.classList.add("show");
}
const gq=$("#gq");
gq.addEventListener("input",e=>suggest(e.target.value));
gq.addEventListener("keydown",e=>{
  if(e.key==="Enter"){e.preventDefault();location.hash="#/table?q="+encodeURIComponent(gq.value.trim());$("#suggest").classList.remove("show");gq.blur();}
  if(e.key==="Escape"){gq.value="";$("#suggest").classList.remove("show");gq.blur();}
});
document.addEventListener("click",e=>{if(!e.target.closest(".gsearch"))$("#suggest").classList.remove("show");});
document.addEventListener("keydown",e=>{
  const t=e.target,typing=t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.isContentEditable);
  if(!typing&&e.key==="/"){e.preventDefault();gq.focus();gq.select();}
});
$("#menuBtn").addEventListener("click",()=>$("#side").classList.toggle("open"));
window.addEventListener("hashchange",route);
tree();
route();
</script>
