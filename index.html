  '<div class="card"><h3 style="margin-top:0">现实案例对照组（2026-11-05 新增）</h3><p class="note">给全表想象配一列「现实里做到了哪一步」：'+DB.cases.list.length+' 个可核查案例，分八类现实路径（皮层内 / 血管内 / 写入刺激 / 语言解码 / 非侵入 / 监管支付 / 消费灰产 / 失败遗留），每个案例标注 <b>证据等级 E1–E4</b>（监管批准 / 同行评议 / 注册临床 / 厂商宣称）、量化指标，以及最关键的<b>「没做到什么」</b>。纪律是<b>把宣称与证据分开摆放</b>——同一件事经常存在「厂商称已成功」与「公开登记查无试验」两种说法。案例同时反向挂到条目页，可正查与反查。详见 <a href="#/cases">现实案例对照组</a>。</p></div>'+
  '<div class="card"><h3 style="margin-top:0">现有科技组合（2026-11-05 新增）</h3><p class="note">与难度标尺正交的第四个数轴：<b>不发明任何新东西，只把今天买得到的部件拼起来能做到什么</b>。'+DB.compose.list.length+' 条组合分三档——<b>A 现货可拼</b>（不需审批，今天能出原型）、<b>B 需器件与审批</b>（部件齐全，6–36 个月）、<b>C 技术成立但制度未开</b>（没有适应证 / 收费编码，或直接被现行法禁止）。每条给出「部件 → 怎么拼 → 谁已做到 → 真正卡点 → 与作品版差距」。凡属想象级而非工程级的（如记忆写入），明确排除并说明理由。详见 <a href="#/compose">现有科技组合</a>。</p></div>'+
  '<div class="card"><h3 style="margin-top:0">资料与免责</h3><p class="note">作品设定以官方文本与游戏内资料为准；现实进展以 2025–2026 年公开报道与《State of Brain Emulation Report》(2025) 为锚，行业数字仅用于量级参照。两处需以原作为准：①《Cyberpunk: Edgerunners》第二季（2026）的 Soulkiller 军备竞赛与 Capri 设定依据 2026 年媒体报道整理；②《The Matrix Online》已于 2009 关服，其设定依据当时官方资料。<b>伦理分级与法律状态均为分析工具，不构成法律或合规意见</b>；真实项目应走机构伦理审查并咨询执业律师。跨境业务须逐法域重判——同一行为在不同国家结论可能完全相反。</p></div>'+

// ---------- 路由 ----------
// v2.0 旧链接保活：hash 路由发不了 301，只能在客户端做等价的软重定向。
// 三件事：① 别名（历史上用过的写法 / 常见简写）② 编号大小写归一 ③ 找不到时给近似建议。
const ALIAS={
  tbl:"table",tables:"table",list:"table",sheet:"table",
  techs:"tech",technology:"tech",technologies:"tech",
  devices:"dev",device:"dev",hardware:"dev",
  indications:"ind",indication:"ind",clinical:"ind",
  regulation:"reg",regs:"reg",regulatory:"reg",approval:"reg",
  reproducible:"rep",repro:"rep",datasets:"rep",
  kits:"compose",kit:"compose",combo:"compose",stack:"compose",
  map:"mapst",maps:"mapst",status:"mapst",landing:"mapst",
  idx:"index",catalog:"index",
  price:"price",prices:"price",pricing:"price",cost:"price",budget:"price",
  aboutus:"about",faq:"about",method:"about",
  home2:"home",start:"home",overview:"home"
};
// 这些路由的第二段是「字母+数字」编号，大小写必须归一（T22 / t22 / Tech/t22 都该到同一页）
const KEYSEG={tech:1,dev:1,ind:1,reg:1,rep:1,case:1,item:1,ethics:1,law:1,lv:1};
const ROUTES=["tech","dev","ind","reg","rep","cases","case","compose","item","mapst","price","scale","ethics","law","table","index","glossary","about","reality","hot","work","concept","group","lv","home"];
function lev(a,b){
  const m=a.length,n=b.length,d=[];
  for(let i=0;i<=m;i++){d[i]=[i];}
  for(let j=0;j<=n;j++){d[0][j]=j;}
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[m][n];
}
function normSeg(seg){
  if(!seg.length)return seg;
  let t=seg[0];
  const al=ALIAS[String(t).toLowerCase()];
  if(al)t=al;
  else{const lo=String(t).toLowerCase();if(ROUTES.indexOf(lo)>=0)t=lo;}
  const out=[t];
  for(let i=1;i<seg.length;i++){
    let s=seg[i];
    if(KEYSEG[t]&&/^[a-z]\d{1,2}$/i.test(s))s=s.toUpperCase();
    out.push(s);
  }
  return out;
}
const RNAME={tech:"技术条目",dev:"设备与产品目录",ind:"临床适应证图谱",reg:"监管与准入路径",rep:"可复现层",cases:"现实案例对照组",case:"现实案例",compose:"现有科技组合",item:"功能条目",mapst:"六档落地状态",scale:"结论与难度标尺",ethics:"伦理标准",law:"法律标准",table:"完整表格",index:"索引与反查",glossary:"术语表",about:"关于",reality:"现实基线",hot:"热门作品总结",work:"作品页",concept:"术语",group:"主题概念",lv:"等级",home:"首页"};
// 未知路由：先猜你要去哪，再给三条兜底入口
function view404(t,seg){
  const near=[];
  ROUTES.forEach(r=>{const d=lev(t,r);if(d<=2||(t.length>=2&&r.indexOf(t)===0))near.push([d,r]);});
  near.sort((a,b)=>a[0]-b[0]);
  const tips=near.slice(0,4).map(x=>'<a class=tile href="#/'+x[1]+'"><b>#/'+x[1]+"</b><span>"+esc(RNAME[x[1]]||"")+"</span></a>").join("");
  return "<h1>没有这一页</h1><p class=lead>地址里的 <code>#/"+esc(seg.join("/"))+"</code> 对不上任何页面。旧版本用过的写法（<code>tbl</code> / <code>devices</code> / <code>kits</code> / 小写编号等）会自动跳转，这一条不在名单里。</p>"+
    (tips?'<h2>你要找的可能是</h2><div class=grid>'+tips+"</div>":"")+
    '<h2>三个常去的入口</h2><div class=grid>'+
    '<a class=tile href="#/"><b>首页</b><span>两侧入口总览与现实侧五层</span></a>'+

    "</div><p class=note>按 <b>/</b> 可聚焦搜索框；或直接改地址栏里的编号。</p>";
}

function parseHash(){
  const raw=location.hash.replace(/^#\/?/,"");
  const i=raw.indexOf("?"),p=i>=0?raw.slice(0,i):raw,q=i>=0?raw.slice(i+1):"";
  return {seg:p.split("/").filter(Boolean),q:new URLSearchParams(q)};
}
function route(){
  const raw=parseHash();
  const seg=normSeg(raw.seg), q=raw.q;
  const t=seg[0]||"home";
  // 地址栏与规范路由不一致（别名 / 大小写）时静默改写，不新增历史记录，后退仍可用
  const qs=raw.q.toString();
  const canon="#/"+seg.join("/")+(qs?"?"+qs:"");
  const was="#/"+raw.seg.join("/")+(qs?"?"+qs:"");

  let html="",crumb=[["首页","#/"]];

  else if(t==="ethics"){
    if(seg[1]){const x=ETHD[seg[1]];html=x?viewEthicDim(seg[1]):notFound("伦理议题 "+seg[1]);crumb.push(["伦理标准","#/ethics"],[x?x.k+" "+x.name:"",""]);}

  else if(t==="tech"){
    const tk=seg[1]||"";

  else if(t==="dev"){

    else{html=viewInd();crumb.push(["临床适应证图谱",""]);}
  }
  else if(t==="reg"){
    const gk=seg[1]||"";
    if(gk){const x=RGD[gk];html=x?viewRegItem(gk):notFound("监管路径 "+gk);crumb.push(["监管与准入","#/reg"],[x?x.k+" "+x.name:"",""]);}
    else{html=viewReg();crumb.push(["监管与准入路径",""]);}
  }
  else if(t==="rep"){
    const ok=seg[1]||"";
    if(ok){const x=OGD[ok];html=x?viewRepItem(ok):notFound("可复现条目 "+ok);crumb.push(["可复现层","#/rep"],[x?x.k+" "+x.name:"",""]);}
    else{html=viewRep();crumb.push(["可复现层",""]);}
  }
  else if(t==="cases"||t==="case"){
    const ck=seg[1]||(t==="case"?"":null);
    if(ck){const c=CSD[ck];html=c?viewCase(ck):notFound("案例 "+ck);crumb.push(["现实案例","#/cases"],[c?c.k+" "+c.name:"",""]);}
    else{html=viewCases();crumb.push(["现实案例对照组",""]);}
  }
  else if(t==="compose"){
    if(seg[1]){const x=KSD[seg[1]];html=x?viewKit(seg[1]):notFound("科技组合 "+seg[1]);crumb.push(["科技组合","#/compose"],[x?x.k+" "+x.name:"",""]);}
    else{html=viewCompose();crumb.push(["现有科技组合",""]);}
  }
  else if(t==="reality"){html=viewReality();crumb.push(["现实基线",""]);}
  else if(t==="mapst"){html=viewMapSt();crumb.push(["六档落地状态",""]);}

  else if(t==="hot"){const w=HM[seg[1]];html=w?viewHot(w):notFound("热门作品 "+seg[1]);crumb.push(["热门作品总结",""],[w?w.name:"",""]);}

  else if(t==="group"){const g=GM[seg[1]];html=g?viewGroup(g):notFound("主题 "+seg[1]);crumb.push(["主题概念",""],[g?g.name:"",""]);}
  else if(t==="glossary"){html=viewGlossary();crumb.push(["术语表",""]);}
  else if(t==="index"){html=viewIndex();crumb.push(["索引与反查",""]);}
  else if(t==="table"){
    // v2.0：支持 #/table?st=ship 直达某一档落地状态（首页六档条与 mapst 页都用它）
    const qst=q.get("st")||"",qq=q.get("q")||"";
    TBL.q=qq;TBL.g="ALL";TBL.lv="ALL";TBL.e="ALL";TBL.v="ALL";
    TBL.st=(DB.mapSt[qst]&&!qq)?qst:"ALL";
    html=viewTable();crumb.push(["完整表格",""]);
  }
  else if(t==="lv"){const x=LVX[seg[1]];html=viewLevel(seg[1]);crumb.push([x?x.axis+"等级":"等级",x?"#/"+x.ax:""],[x?(x.name.indexOf(x.k)===0?x.name:x.k+" "+x.name):"",""]);}
  else html=view404(t,seg);
  $("#crumb").innerHTML=crumb.map((c,i)=>(i?"<span>/</span>":"")+(c[1]?"<a href=\""+c[1]+"\">"+esc(c[0])+"</a>":"<b>"+esc(c[0])+"</b>")).join("");
  $("#view").innerHTML=html+footerHtml();
  bindTable();
  syncTree(seg);
  $("#side").classList.remove("open");
  window.scrollTo(0,0);
}

// ---------- 全局搜索 ----------
// v2.0：不再「工具页优先」。每条记录带权重（现实侧 > 判断框架 > 想象侧 > 作品 / 术语），
// 再按命中质量排序——精确命中可以越级，让「搜 T22 先给技术条目」这件事成立。
// 启动时把各字段拼成小写 haystack 存一次，避免每次按键重做 join+toLowerCase。
const SIDX=(()=>{
  const a=[],add=(t,h,k,f,w)=>a.push({t:t,h:h,k:k,w:w,s:f.join(" ").toLowerCase()});
  IT.forEach(d=>add(d.id+" · "+d.fn,"#/item/"+d.id,"条目",[d.id,d.fn,d.work,d.desc,d.note,d.gap,d.basis],55));
  DB.works.forEach(w=>add(w.name,"#/work/"+w.key,"作品",[w.name,w.sub,w.intro],40));
  DB.hot.concat(DB.lib).forEach(w=>add(w.name,"#/hot/"+w.key,w.deep?"热门":"作品库",[w.name,w.sub,w.hot,w.profile],40));
  DB.glossary.forEach(c=>add(c.term,"#/concept/"+c.key,"术语",[c.term,(c.aliases||[]).join(" "),c.def],45));
  DB.groups.forEach(g=>add(g.name,"#/group/"+g.key,"主题",[g.name,g.desc],45));
  DB.ethics.dims.forEach(x=>add(x.k+" "+x.name,"#/ethics/"+x.k,"伦理",[x.k,x.name,x.en,x.q,x.def,x.real],70));
  DB.ethics.levels.forEach(x=>add(x.k+" "+x.name,"#/ethics","等级",[x.k,x.name,x.def],70));
  DB.law.dims.forEach(x=>add(x.k+" "+x.name,"#/law/"+x.k,"法律",[x.k,x.name,x.en,x.q,x.def,x.law,x.gap],70));
  DB.law.levels.forEach(x=>add(x.k+" "+x.name,"#/law","法律状态",[x.k,x.name,x.def],70));
  DB.tech.list.forEach(x=>add(x.k+" "+x.name,"#/tech/"+x.k,"技术",[x.k,x.name,x.en,x.def,x.how,x.fail].concat((x.vals||[]).map(v=>v[0]+" "+v[1])),100));
  DB.tech.cats.forEach(x=>add(x.name,"#/tech","技术分类",[x.name,x.en,x.desc],95));
  DB.dev.list.forEach(x=>add(x.k+" "+x.name,"#/dev/"+x.k,"设备",[x.k,x.name,x.en,x.vendor,x.country,x.ch,x.fs,x.inv,x.cert,x.price,x.sig,x.pos],100));
  DB.dev.tiers.forEach(x=>add(x.name,"#/dev","设备档位",[x.name,x.en,x.desc],95));
  DB.ind.list.forEach(x=>add(x.k+" "+x.name,"#/ind/"+x.k,"适应证",[x.k,x.name,x.en,x.pop,x.loss,x.now,x.bci,x.reg],100));
  DB.reg.list.forEach(x=>add(x.k+" "+x.name,"#/reg/"+x.k,"监管",[x.k,x.name,x.en,x.juris,x.who,x.head,x.gate].concat(x.vals.map(v=>v[0]+" "+v[1])),95));
  DB.rep.list.forEach(o=>add(o.k+" "+o.name,"#/rep/"+o.k,"可复现",[o.k,o.name,o.en,o.scale,o.access,o.use,o.limit].concat(o.vals.map(v=>v[0]+" "+v[1])),95));
  return a;
})();

  ["技术条目（零件层）","#/tech","标准",98],
  ["设备与产品目录","#/dev","标准",98],

].map(x=>({t:x[0],h:x[1],k:x[2],w:x[3],s:x[0].toLowerCase()}));
// 命中质量 + 层级权重。精确命中和编号前缀都能越级；
// 只命中正文（标题不含关键词）的记录权重砍到 1/5，避免大条目靠长正文霸榜。
function sScore(r,k){
  const t=r.t.toLowerCase();
  let b=0,inTitle=true;
  if(t===k)b=3000;
  else if(t.indexOf(k)===0)b=200;
  else if(t.indexOf(k)>0){
    const i=t.indexOf(k);
    b=" ·-—/：:".indexOf(t.charAt(i-1))>=0?120:20;
  }
  else inTitle=false;
  return (inTitle?r.w*10:r.w*2)+b;
}
function suggest(q){
  const box=$("#suggest"),k=q.trim().toLowerCase();
  if(!k){box.innerHTML="";box.classList.remove("show");return;}
  const hits=[];
  for(let i=0;i<SSTATIC.length;i++){if(SSTATIC[i].s.indexOf(k)!==-1)hits.push(SSTATIC[i]);}
  for(let i=0;i<SIDX.length;i++){if(SIDX[i].s.indexOf(k)!==-1)hits.push(SIDX[i]);}
  hits.sort((a,b)=>sScore(b,k)-sScore(a,k));
  const top=hits.slice(0,10);
  box.innerHTML=top.length?top.map(r=>'<a href="'+r.h+'"><span class="k">'+r.k+"</span><span>"+esc(r.t)+"</span></a>").join("")+'<div class="sg-foot">共 '+hits.length+' 条 · 回车进入表格视图 · 按 <b>/</b> 随时聚焦</div>':'<div class="sg-none">没有命中。试试编号（T22 / C01）、型号（NEO），或者只打两个字。</div>';
  box.classList.add("show");
}
const gq=$("#gq");
gq.addEventListener("input",e=>suggest(e.target.value));
gq.addEventListener("keydown",e=>{
  if(e.key==="Enter"){e.preventDefault();location.hash="#/table?q="+encodeURIComponent(gq.value.trim());$("#suggest").classList.remove("show");gq.blur();}
  if(e.key==="Escape"){gq.value="";$("#suggest").classList.remove("show");gq.blur();}
});
document.addEventListener("click",e=>{if(!e.target.closest(".gsearch"))$("#suggest").classList.remove("show");});
document.addEventListener("keydown",e=>{
  const t=e.target,typing=t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.isContentEditable);
  if(!typing&&e.key==="/"){e.preventDefault();gq.focus();gq.select();}
});
$("#menuBtn").addEventListener("click",()=>$("#side").classList.toggle("open"));
window.addEventListener("hashchange",route);
tree();
